<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>網の直線検出テスト（完成版）</title>
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>
    <h2>網の直線検出プロトタイプ（完成版）</h2>
    <input type="file" id="fileInput" accept="image/*"><br><br>
    
    <div>
        <canvas id="canvasInput" style="max-width: 400px;"></canvas>
        <canvas id="canvasOutput" style="max-width: 400px;"></canvas>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', (e) => {
            let imgElement = document.getElementById('canvasInput');
            let ctx = imgElement.getContext('2d');
            let reader = new FileReader();
            
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    imgElement.width = img.width;
                    imgElement.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    if (typeof cv !== 'undefined' && cv.Mat) { 
                        processImageAdvanced(); 
                    } else {
                        alert("OpenCV.jsがまだ読み込み途中です。数秒待ってから画像を再選択してください。");
                    }
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        function processImageAdvanced() {
            let src = cv.imread('canvasInput');
            let hsv = new cv.Mat();
            let mask = new cv.Mat();
            let dst = src.clone();

            // 1. グリーンバック除去
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
            
            let lowGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [35, 35, 35, 0]);
            let highGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [90, 255, 255, 255]);
            cv.inRange(hsv, lowGreen, highGreen, mask);
            cv.bitwise_not(mask, mask); // 網を白に

            // 2. クロージング＆オープニング（ねじれ模様を潰して「滑らかな一本の棒」にする）
            let kernel3 = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
            let kernel5 = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
            cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernel5); // 少し強めに穴埋め
            cv.morphologyEx(mask, mask, cv.MORPH_OPEN, kernel3);  // 飛び出たノイズを除去

            // 3. パラメータを調整したハフ変換
            let lines = new cv.Mat();
            // 閾値: 40, 最小線長: 60, 最大隙間: 100
            cv.HoughLinesP(mask, lines, 1, Math.PI / 180, 40, 60, 100);

            // 4. 直線のグルーピング
            let lineGroup = [];
            const ANGLE_THRESHOLD = 8;     // 許容する角度差
            const INTERCEPT_THRESHOLD = 50; // 実績値（60）をベースに微調整

            let midY = Math.round(src.rows / 2);

            for (let i = 0; i < lines.rows; ++i) {
                let x1 = lines.data32S[i * 4];
                let y1 = lines.data32S[i * 4 + 1];
                let x2 = lines.data32S[i * 4 + 2];
                let y2 = lines.data32S[i * 4 + 3];

                let angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
                if (angle > 90) angle -= 180;
                if (angle < -90) angle += 180;

                // 網のメイン角度（約65度〜80度）以外の細かなねじれノイズをカット
                if (Math.abs(angle) < 55 || Math.abs(angle) > 85) continue;

                let a = (x2 - x1) !== 0 ? (y2 - y1) / (x2 - x1) : 9999;
                let b = y1 - a * x1;
                let centerX = (midY - b) / a;

                let matched = false;
                for (let group of lineGroup) {
                    // 【改善】「本来のコードの傾き（青/オレンジ）」が混ざらないよう、角度の符号（正負）が一致していることも条件に追加
                    let isSameSign = (group.angle >= 0 && angle >= 0) || (group.angle < 0 && angle < 0);

                    if (isSameSign && Math.abs(group.angle - angle) < ANGLE_THRESHOLD && Math.abs(group.centerX - centerX) < INTERCEPT_THRESHOLD) {
                        group.lines.push({x1, y1, x2, y2, a, b});
                        matched = true;
                        break;
                    }
                }

                if (!matched) {
                    lineGroup.push({ angle, centerX, lines: [{x1, y1, x2, y2, a, b}] });
                }
            }

            // 5. 統合された線を描画
            lineGroup.forEach(group => {
                let sumA = 0, sumB = 0;
                group.lines.forEach(l => {
                    sumA += l.a;
                    sumB += l.b;
                });
                let avgA = sumA / group.lines.length;
                let avgB = sumB / group.lines.length;

                let startY = 0;
                let startX = Math.round((startY - avgB) / avgA);
                let endY = dst.rows;
                let endX = Math.round((endY - avgB) / avgA);

                // 角度による色分け（今回の画像に合わせて最適化）
                // 実際に描画される直線の傾き（avgA）をベースに判定
                let color = (avgA > 0) ? new cv.Scalar(255, 165, 0, 255) : new cv.Scalar(0, 100, 255, 255);

                cv.line(dst, new cv.Point(startX, startY), new cv.Point(endX, endY), color, 3);
            });

            cv.imshow('canvasOutput', dst);

            // メモリ解放
            src.delete(); hsv.delete(); mask.delete(); dst.delete();
            lines.delete(); kernel3.delete(); kernel5.delete(); lowGreen.delete(); highGreen.delete();
        }
    </script>
</body>
</html>
