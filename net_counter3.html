<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<body>

<h2>STEP2 モルフォロジー + Skeleton準備</h2>

<input type="file" id="fileInput">

<div class="status" id="status">
OpenCVロード待機中...
</div>

<div class="wrap">

</div>

<div class="panel">

</div>

</div>

</div>

<div class="panel">
<h3>理想格子ドット生成結果 (Part6)</h3>
<canvas id="gridCanvas"></canvas>
</div>
    
</div>

<div class="controls">

<h3>HSV</h3>

<div class="row">
<label>Hue Min</label>
<input type="range" id="hMin" min="0" max="360" value="80">
<span class="value" id="hMinVal">80</span>
</div>

<input type="range" id="hMax" min="0" max="360" value="180">
<span class="value" id="hMaxVal">180</span>
</div>

<input type="range" id="sMin" min="0" max="100" value="20">
<span class="value" id="sMinVal">20</span>
</div>

<label>Val Min</label>
<input type="range" id="vMin" min="0" max="100" value="15">
<span class="value" id="vMinVal">15</span>
</div>

<span class="value" id="kernelSizeVal">3</span>
</div>

  θA (／方向): <span id="thetaA" style="color: #00ff00;">--</span>°
  / 
  θB (＼方向): <span id="thetaB" style="color: #00ff00;">--</span>°
</div>

Pitch A :
<span id="pitchA">--</span>

<script>

let currentImage = null;
let cvReady = false;

const srcCanvas = document.getElementById("srcCanvas");
const binaryCanvas = document.getElementById("binaryCanvas");
const morphCanvas = document.getElementById("morphCanvas");
const skeletonCanvas = document.getElementById("skeletonCanvas");
const gridCanvas = document.getElementById("gridCanvas"); // 📍 追加

const statusEl = document.getElementById("status");

const sliders = [
"hMin",
"hMax",
"sMin",
"vMin",
"kernelSize",
"iterations"
];

sliders.forEach(id=>{

    const s = document.getElementById(id);
    const v = document.getElementById(id+"Val");

    v.textContent = s.value;

    s.addEventListener("input",()=>{

        v.textContent = s.value;

        if(currentImage && cvReady){
            processImage();
        }

    });

});

document.getElementById("fileInput").addEventListener("change",e=>{

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = ()=>{

        currentImage = img;

        setupCanvasSize(img);

        processImage();

    };

    img.src = URL.createObjectURL(file);

});

// 📍 【最重要修正】gridCanvasの内部サイズも元画像と完全に一致させる
function setupCanvasSize(img){

    const list = [
        srcCanvas,
        binaryCanvas,
        morphCanvas,
        skeletonCanvas,
        gridCanvas // 👈 ここに gridCanvas を追加し忘れていたのが原因でした！
    ];

    list.forEach(c=>{

        c.width = img.width;
        c.height = img.height;

    });

}

function waitForOpenCV(){

    if(typeof cv === "undefined"){

        setTimeout(waitForOpenCV,100);
        return;

    }

    cvReady = true;

    statusEl.textContent =
        "OpenCVロード完了";

}

waitForOpenCV();

function processImage(){

    if(!currentImage) return;

    drawSource();

    const binaryMat = createBinaryImage();

    const morphMat = createMorphImage(binaryMat);

    const skeletonMat = createSkeletonImage(morphMat);

    cv.rectangle(
        skeletonMat,
        new cv.Point(0, 0),
        new cv.Point(skeletonMat.cols, skeletonMat.rows),
        new cv.Scalar(0),
        30 
    );

    detectAngles(skeletonMat);

}

function drawSource(){

    const ctx =
        srcCanvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        srcCanvas.width,
        srcCanvas.height
    );

    ctx.drawImage(
        currentImage,
        0,
        0
    );

}

function createBinaryImage(){

    const srcCanvas =
        document.getElementById("srcCanvas");

    let src =
        cv.imread(srcCanvas);

    let hsv =
        new cv.Mat();

    cv.cvtColor(
        src,
        hsv,
        cv.COLOR_RGBA2RGB
    );

    cv.cvtColor(
        hsv,
        hsv,
        cv.COLOR_RGB2HSV
    );

    const hMin =
        parseInt(document.getElementById("hMin").value);

    const hMax =
        parseInt(document.getElementById("hMax").value);

    const sMin =
        parseInt(document.getElementById("sMin").value);

    const vMin =
        parseInt(document.getElementById("vMin").value);

    let lower =
        new cv.Mat(
            hsv.rows,
            hsv.cols,
            hsv.type(),
            [
                hMin/2,
                sMin*2.55,
                vMin*2.55,
                0
            ]
        );

    let upper =
        new cv.Mat(
            hsv.rows,
            hsv.cols,
            hsv.type(),
            [
                hMax/2,
                255,
                255,
                255
            ]
        );

    let bgMask =
        new cv.Mat();

    cv.inRange(
        hsv,
        lower,
        upper,
        bgMask
    );

    let wireMask =
        new cv.Mat();

    cv.bitwise_not(
        bgMask,
        wireMask
    );

    cv.imshow(
        "binaryCanvas",
        wireMask
    );

    src.delete();
    hsv.delete();
    lower.delete();
    upper.delete();
    bgMask.delete();

    return wireMask;
}

function createMorphImage(binaryMat){

    const kernelSize =
        parseInt(
            document.getElementById("kernelSize").value
        );

    const iterations =
        parseInt(
            document.getElementById("iterations").value
        );

    let morph =
        binaryMat.clone();

    let kernel =
        cv.getStructuringElement(
            cv.MORPH_RECT,
            new cv.Size(
                kernelSize,
                kernelSize
            )
        );

    cv.morphologyEx(
        morph,
        morph,
        cv.MORPH_OPEN,
        kernel,
        new cv.Point(-1,-1),
        iterations
    );

    cv.morphologyEx(
        morph,
        morph,
        cv.MORPH_CLOSE,
        kernel,
        new cv.Point(-1,-1),
        iterations
    );
    
    cv.imshow(
        "morphCanvas",
        morph
    );

    kernel.delete();

    binaryMat.delete();

    return morph;
}

function createSkeletonImage(morphMat){

    const skeletonMat =
        zhangSuenThinning(morphMat);
    
    cv.imshow(
        "skeletonCanvas",
        skeletonMat
    );

    morphMat.delete();
    return skeletonMat;
}

function zhangSuenThinning(src){

    let img = src.clone();

    const rows = img.rows;
    const cols = img.cols;

    let changed;

    do{

        changed = false;

        changed |= thinningIteration(
            img,
            rows,
            cols,
            0
        );

        changed |= thinningIteration(
            img,
            rows,
            cols,
            1
        );

    }while(changed);

    return img;
}

function thinningIteration(
    img,
    rows,
    cols,
    iter
){

    const marker =
        new Uint8Array(rows * cols);

    let changed = false;

    const data = img.data;

    for(let y=1;y<rows-1;y++){

        for(let x=1;x<cols-1;x++){

            const p1 = y*cols+x;

            if(data[p1]===0)
                continue;

            const p2=data[(y-1)*cols+x];
            const p3=data[(y-1)*cols+x+1];
            const p4=data[y*cols+x+1];
            const p5=data[(y+1)*cols+x+1];
            const p6=data[(y+1)*cols+x];
            const p7=data[(y+1)*cols+x-1];
            const p8=data[y*cols+x-1];
            const p9=data[(y-1)*cols+x-1];

            const b =
                (p2>0)+(p3>0)+(p4>0)+
                (p5>0)+(p6>0)+(p7>0)+
                (p8>0)+(p9>0);

            if(b<2 || b>6)
                continue;

            const a =
                (p2===0&&p3>0)+
                (p3===0&&p4>0)+
                (p4===0&&p5>0)+
                (p5===0&&p6>0)+
                (p6===0&&p7>0)+
                (p7===0&&p8>0)+
                (p8===0&&p9>0)+
                (p9===0&&p2>0);

            if(a!==1)
                continue;

            if(iter===0){

                if(
                    (p2>0 && p4>0 && p6>0) ||
                    (p4>0 && p6>0 && p8>0)
                ){
                    continue;
                }

            }else{

                if(
                    (p2>0 && p4>0 && p8>0) ||
                    (p2>0 && p6>0 && p8>0)
                ){
                    continue;
                }
            }

            marker[p1]=1;
        }
    }

    for(let i=0;i<marker.length;i++){

        if(marker[i]){

            data[i]=0;
            changed=true;
        }
    }

    return changed;
}

// 📍 司令塔関数
function detectAngles(skeletonMat){

    const hist = buildAngleHistogram(skeletonMat);
    const candidates = findAngleCandidates(hist);

    // 💡 これで best[0].peaks と best[1].peaks にデータが保持されます
    const best = evaluateAngles(skeletonMat, candidates);

    document.getElementById("thetaA").textContent = best[0].theta;
    document.getElementById("thetaB").textContent = best[1].theta;
    document.getElementById("pitchA").textContent = best[0].pitch;
    document.getElementById("pitchB").textContent = best[1].pitch;

    // 💡 ChatGPTが言っている「const peaksA = [...]」の状態を作ります
    if (best[0].theta !== "--" && best[0].pitch !== "--" && best[1].theta !== "--") {
        const peaksA = best[0].peaks; // ★ Part5のピーク検出結果を保持！
        const peaksB = best[1].peaks; // ★ Part5のピーク検出結果を保持！

        // 📍 【修正箇所1】画像の幅(w)と高さ(h)をしっかり定義してあげる
        const w = skeletonMat.cols;
        const h = skeletonMat.rows;

        // 📍 【修正箇所2】pitchA / pitchB ではなく、正しい変数名 best[0].pitch / best[1].pitch から渡す
        const rhoStartA = estimateRhoStart(peaksA, best[0].pitch);
        const rhoStartB = estimateRhoStart(peaksB, best[1].pitch);

        // 現在はまだ機械的に引いている段階（Part6のまま維持）
        const idealA = buildIdealLines(
            best[0].theta,
            best[0].pitch,
            rhoStartA,
            w,
            h
        );

        const idealB = buildIdealLines(
            best[1].theta,
            best[1].pitch,
            rhoStartB,
            w,
            h
        );

        const crossPoints = buildCrossPoints(idealA, idealB);

        const scoredPoints = scoreGridPoints(crossPoints, skeletonMat);

        const snappedPoints = snapGridPoints(scoredPoints, skeletonMat);

        // ========================================================
        // 🎯 Part8-2 & 8-3: 描画（吸着ドット ＆ 赤い線デバッグ）
        // ========================================================
        const canvas = document.getElementById("gridCanvas");
        const ctx = canvas.getContext("2d");
        const src = document.getElementById("srcCanvas");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(src, 0, 0);

        for (const p of snappedPoints) {
            // スコアが低すぎる（網がない背景部分の）ドットは表示しない
            if (p.score < 15) continue;

            // 🔴 赤い線：元の位置（p.origX, p.origY）から、移動後の位置（p.x, p.y）へ線を引く
            ctx.strokeStyle = "red";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.origX, p.origY); // ⭕️ p.origX に修正
            ctx.lineTo(p.x, p.y);
            ctx.stroke();

            // 🟡 黄色い点：結び目の真ん中に吸着したドットを描画
            ctx.fillStyle = "yellow";
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    skeletonMat.delete();
}

function buildAngleHistogram(mat){

    const hist = new Array(180).fill(0);

    const w = mat.cols;
    const h = mat.rows;
    const d = mat.data;

    const border = 10;

    const points = [];

    for(let y=border;y<h-border;y++){

        for(let x=border;x<w-border;x++){

            if(d[y*w+x]>0){

                points.push({x,y});
            }
        }
    }

    const maxDist = 12;

    for(let i=0;i<points.length;i++){

        const p1 = points[i];

        for(let j=i+1;j<points.length;j++){

            const p2 = points[j];

            const dx = p2.x-p1.x;
            const dy = p2.y-p1.y;

            const dist2 =
                dx*dx+dy*dy;

            if(
                dist2<4 ||
                dist2>maxDist*maxDist
            ){
                continue;
            }

            let ang =
                Math.atan2(dy,dx)*
                180/Math.PI;

            ang =
                Math.round(
                    (ang+180)%180
                );

            hist[ang]++;
        }
    }

    return smoothHistogram(
        hist,
        5
    );
}

function smoothHistogram(
    hist,
    radius
){

    const out =
        new Array(hist.length).fill(0);

    for(let i=0;i<hist.length;i++){

        let sum=0;
        let cnt=0;

        for(
            let k=-radius;
            k<=radius;
            k++
        ){

            const idx =
                (i+k+180)%180;

            sum += hist[idx];
            cnt++;
        }

        out[i]=sum/cnt;
    }

    return out;
}

function evaluateAngles(skeletonMat, candidates) {
    let bestPair = null;
    let maxScore = -1;

    for (let i = 0; i < candidates.length; i++) {
        for (let j = i + 1; j < candidates.length; j++) {
            const theta1 = candidates[i];
            const theta2 = candidates[j];

            let diffAngle = Math.abs(theta1 - theta2);
            diffAngle = Math.min(diffAngle, 180 - diffAngle);
            if (diffAngle < 40) continue; 

            const hist1 = buildRhoHistogram(skeletonMat, theta1);
            const hist2 = buildRhoHistogram(skeletonMat, theta2);

            const peaks1 = findRhoPeaks(hist1, 20); 
            const peaks2 = findRhoPeaks(hist2, 20);

            const pitch1 = estimatePitch(peaks1);
            const pitch2 = estimatePitch(peaks2);

            if (pitch1 < 20 || pitch1 > 80 || pitch2 < 20 || pitch2 > 80) continue;

            const score = peaks1.length + peaks2.length;

            if (score > maxScore) {
                maxScore = score;
                // 💡 ChatGPTの指示通り、検出された「生のpeaks（ピーク配列）」をしっかり保持してセットする
                bestPair = [
                    { theta: theta1, pitch: pitch1, peaks: peaks1 }, 
                    { theta: theta2, pitch: pitch2, peaks: peaks2 }
                ];
            }
        }
    }

    if (!bestPair) {
        return [
            { theta: "--", pitch: "--", peaks: [] },
            { theta: "--", pitch: "--", peaks: [] }
        ];
    }

    bestPair.sort((a, b) => a.theta - b.theta);
    return bestPair;
}

function findRhoPeaks(hist, minSpacing) {
    const peaks = [];
    
    for (let r = 2; r < hist.length - 2; r++) {
        if (hist[r] > hist[r-1] && hist[r] > hist[r-2] &&
            hist[r] > hist[r+1] && hist[r] > hist[r+2] && hist[r] > 10) {
            
            let tooClose = false;
            for (const p of peaks) {
                if (Math.abs(r - p) < minSpacing) {
                    tooClose = true;
                    break;
                }
            }
            if (!tooClose) {
                peaks.push(r);
            }
        }
    }
    return peaks;
}
    
function findAngleCandidates(hist){

    const peaks=[];

    const tmp=
        hist.map(
            (v,i)=>({a:i,v})
        );

    tmp.sort(
        (a,b)=>b.v-a.v
    );

    for(const p of tmp){

        let ok=true;

        for(const q of peaks){

            let d=
                Math.abs(
                    p.a-q
                );

            d=
                Math.min(
                    d,
                    180-d
                );

            if(d<20){

                ok=false;
                break;
            }
        }

        if(ok){

            peaks.push(p.a);
        }

        if(peaks.length===8)
            break;
    }

    return peaks;
}

function buildRhoHistogram(
    mat,
    thetaDeg
){

    const w=mat.cols;
    const h=mat.rows;

    const d=mat.data;

    const theta=
        thetaDeg*
        Math.PI/180;

    const ct=
        Math.cos(theta);

    const st=
        Math.sin(theta);

    const rhoMax=
        Math.ceil(
            Math.sqrt(
                w*w+h*h
            )
        );

    const hist=
        new Array(
            rhoMax*2+1
        ).fill(0);

    for(let y=0;y<h;y++){

        for(let x=0;x<w;x++){

            if(
                d[y*w+x]===0
            ) continue;

            const rho=
                Math.round(
                    x*ct+y*st
                );

            hist[
                rho+rhoMax
            ]++;
        }
    }

    return hist;
}

function estimatePitch(rhoList){

    if(rhoList.length < 4){
        return 0;
    }

    rhoList.sort((a,b)=>a-b);

    const diffs = [];

    for(let i=1;i<rhoList.length;i++){

        const d = rhoList[i]-rhoList[i-1];

        if(d < 20) continue;
        if(d > 80) continue;

        diffs.push(d);
    }

    if(diffs.length===0){
        return 0;
    }

    diffs.sort((a,b)=>a-b);

    return diffs[Math.floor(diffs.length/2)];
}
    
function buildIdealLines(
    thetaDeg,
    pitch,
    rhoStart,
    width,
    height
){

    const theta =
        thetaDeg*Math.PI/180;

    const diag =
        Math.sqrt(
            width*width+
            height*height
        );

    const lines=[];

    let rho=rhoStart;

    while(rho> -diag)
        rho-=pitch;

    for(
        ;
        rho<=diag;
        rho+=pitch
    ){

        lines.push({
            theta,
            rho
        });

    }

    return lines;
}

function buildCrossPoints(linesA, linesB){

    const pts = [];

    for(const a of linesA){
        const ca = Math.cos(a.theta);
        const sa = Math.sin(a.theta);

        for(const b of linesB){
            const cb = Math.cos(b.theta);
            const sb = Math.sin(b.theta);

            const det = ca*sb - cb*sa;

            if(Math.abs(det)<1e-6) continue;

            const x = (a.rho*sb - b.rho*sa) / det;
            const y = (b.rho*ca - a.rho*cb) / det;

            pts.push({x,y});
        }
    }
    return pts;
}

// 📍 【背景描画】元画像全体を背景として綺麗にコピーする
function drawGridPoints(canvas, pts){

    const ctx = canvas.getContext("2d");

    const src = document.getElementById("srcCanvas");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(src, 0, 0);

    ctx.fillStyle = "yellow";

    for(const p of pts){
        if(
            p.x < 0 ||
            p.y < 0 ||
            p.x >= canvas.width ||
            p.y >= canvas.height
        ){
            continue;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
    }
}

function estimateRhoStart(peaks, pitch){

    if(!peaks || peaks.length===0)
        return 0;

    const phaseHist = new Map();

    for(const rho of peaks){

        let phase = rho % pitch;

        if(phase < 0)
            phase += pitch;

        const key = Math.round(phase);

        phaseHist.set(
            key,
            (phaseHist.get(key)||0)+1
        );
    }

    let bestPhase = 0;
    let bestCount = 0;

    for(const [phase,count] of phaseHist){

        if(count > bestCount){

            bestCount = count;
            bestPhase = phase;
        }
    }

    return bestPhase;
}
    
function skeletonDensity(
    skeleton,
    cx,
    cy,
    radius
){

    let count = 0;

    const x0 =
        Math.max(
            0,
            Math.floor(cx-radius)
        );

    const x1 =
        Math.min(
            skeleton.cols-1,
            Math.ceil(cx+radius)
        );

    const y0 =
        Math.max(
            0,
            Math.floor(cy-radius)
        );

    const y1 =
        Math.min(
            skeleton.rows-1,
            Math.ceil(cy+radius)
        );

    for(let y=y0;y<=y1;y++){

        for(let x=x0;x<=x1;x++){

            const dx=x-cx;
            const dy=y-cy;

            if(
                dx*dx+dy*dy >
                radius*radius
            ){
                continue;
            }

            if(
                skeleton.ucharPtr(y,x)[0]
                >0
            ){
                count++;
            }
        }
    }

    return count;
}

function scoreGridPoints(
    points,
    skeleton
){

    const out=[];

    for(const p of points){

        const score =
            skeletonDensity(
                skeleton,
                p.x,
                p.y,
                8
            );

        out.push({
            x:p.x,
            y:p.y,
            score
        });
    }

    return out;
}

    function snapPointToSkeleton(
    p,
    skeletonMat,
    searchRadius = 6
){

    let bestX = p.x;
    let bestY = p.y;
    let bestScore = -1;

    for(let dy=-searchRadius; dy<=searchRadius; dy++){

        for(let dx=-searchRadius; dx<=searchRadius; dx++){

            const x = Math.round(p.x + dx);
            const y = Math.round(p.y + dy);

            if(
                x < 0 ||
                y < 0 ||
                x >= skeletonMat.cols ||
                y >= skeletonMat.rows
            ){
                continue;
            }

            const score =
                skeletonDensity(
                    skeletonMat,
                    x,
                    y,
                    5
                );

            if(score > bestScore){

                bestScore = score;
                bestX = x;
                bestY = y;
            }
        }
    }

    return {
        x: bestX,
        y: bestY,
        score: bestScore
    };
}

    function snapGridPoints(scoredPoints, skeletonMat) {
    const dxList = [];
    const dyList = [];
    const validPoints = [];

    // 📍 各点がどれだけ動きたいか（理想と現実のズレ）を調べる
    for (const p of scoredPoints) {
        if (p.score < 5) continue; // 網から外れている点は無視

        const s = snapPointToSkeleton(p, skeletonMat, 6);
        
        // 元の位置からどれだけ動いたか（移動量）を記録
        dxList.push(s.x - p.x);
        dyList.push(s.y - p.y);
        
        validPoints.push({ orig: p, snapped: s });
    }

    if (validPoints.length === 0) return [];

    // 📍 移動量の中央値（メディアン：多数決）を計算するヘルパー関数
    const median = (arr) => {
        if (arr.length === 0) return 0;
        const sorted = [...arr].sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    };

    const globalDx = median(dxList);
    const globalDy = median(dyList);

    // 📍 【Part8-3本命】個々の暴走を無視し、全員一律で「中央値の分だけ」カチッとズラす
    const finalPoints = [];
    for (const item of validPoints) {
        finalPoints.push({
            x: item.orig.x + globalDx,
            y: item.orig.y + globalDy,
            score: item.snapped.score, // 吸着先のスコアを引き継ぐ
            origX: item.orig.x,        // デバッグ赤線用の元座標
            origY: item.orig.y
        });
    }

    return finalPoints;
} // 📍ここが snapGridPoints 関数の終わりです
