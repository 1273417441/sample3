<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>STEP2 Skeleton Preparation</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>

body{
    background:#111;
    color:white;
    font-family:sans-serif;
    margin:20px;
}

h2{
    margin-bottom:10px;
}

.wrap{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.panel{
    display:flex;
    flex-direction:column;
}

canvas{
    border:1px solid #444;
    max-width:600px;
}

.controls{
    margin-top:20px;
    background:#222;
    padding:15px;
}

.row{
    margin-bottom:10px;
}

label{
    display:inline-block;
    width:160px;
}

.value{
    display:inline-block;
    width:50px;
    color:#00ff66;
}

.status{
    margin-top:10px;
    color:#ffcc00;
}

</style>
</head>
<body>

<h2>STEP2 モルフォロジー + Skeleton準備</h2>

<input type="file" id="fileInput">

<div class="status" id="status">
OpenCVロード待機中...
</div>

<div class="wrap">

<div class="panel">
<h3>元画像</h3>
<canvas id="srcCanvas"></canvas>
</div>

<div class="panel">
<h3>二値化</h3>
<canvas id="binaryCanvas"></canvas>
</div>

<div class="panel">
<h3>モルフォロジー後</h3>
<canvas id="morphCanvas"></canvas>
</div>

<div class="panel">
<h3>Skeleton</h3>
<canvas id="skeletonCanvas"></canvas>
</div>

</div>

<div class="controls">

<h3>HSV</h3>

<div class="row">
<label>Hue Min</label>
<input type="range" id="hMin" min="0" max="360" value="80">
<span class="value" id="hMinVal">80</span>
</div>

<div class="row">
<label>Hue Max</label>
<input type="range" id="hMax" min="0" max="360" value="180">
<span class="value" id="hMaxVal">180</span>
</div>

<div class="row">
<label>Sat Min</label>
<input type="range" id="sMin" min="0" max="100" value="20">
<span class="value" id="sMinVal">20</span>
</div>

<div class="row">
<label>Val Min</label>
<input type="range" id="vMin" min="0" max="100" value="15">
<span class="value" id="vMinVal">15</span>
</div>

<hr>

<h3>Morphology</h3>

<div class="row">
<label>Kernel Size</label>
<input type="range" id="kernelSize" min="1" max="15" value="3">
<span class="value" id="kernelSizeVal">3</span>
</div>

<div class="row">
<label>Iterations</label>
<input type="range" id="iterations" min="1" max="10" value="1">
<span class="value" id="iterationsVal">1</span>
</div>

<div id="angleInfo" style="margin: 20px 0; padding: 10px; background: #222; border-radius: 5px; font-size: 18px; font-weight: bold; color: #fff; text-align: center;">
  θA (／方向): <span id="thetaA" style="color: #00ff00;">--</span>°
  / 
  θB (＼方向): <span id="thetaB" style="color: #00ff00;">--</span>°
</div>

<div>
Pitch A :
<span id="pitchA">--</span>
</div>

<div>
Pitch B :
<span id="pitchB">--</span>
</div>
    
</div>

<script>

let currentImage = null;
let cvReady = false;

const srcCanvas = document.getElementById("srcCanvas");
const binaryCanvas = document.getElementById("binaryCanvas");
const morphCanvas = document.getElementById("morphCanvas");
const skeletonCanvas = document.getElementById("skeletonCanvas");

const statusEl = document.getElementById("status");

const sliders = [
"hMin",
"hMax",
"sMin",
"vMin",
"kernelSize",
"iterations"
];

sliders.forEach(id=>{

    const s = document.getElementById(id);
    const v = document.getElementById(id+"Val");

    v.textContent = s.value;

    s.addEventListener("input",()=>{

        v.textContent = s.value;

        if(currentImage && cvReady){
            processImage();
        }

    });

});

document.getElementById("fileInput").addEventListener("change",e=>{

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = ()=>{

        currentImage = img;

        setupCanvasSize(img);

        processImage();

    };

    img.src = URL.createObjectURL(file);

});

function setupCanvasSize(img){

    const list = [
        srcCanvas,
        binaryCanvas,
        morphCanvas,
        skeletonCanvas
    ];

    list.forEach(c=>{

        c.width = img.width;
        c.height = img.height;

    });

}

function waitForOpenCV(){

    if(typeof cv === "undefined"){

        setTimeout(waitForOpenCV,100);
        return;

    }

    cvReady = true;

    statusEl.textContent =
        "OpenCVロード完了";

}

waitForOpenCV();

function processImage(){

    if(!currentImage) return;

    drawSource();

    const binaryMat = createBinaryImage();

    const morphMat = createMorphImage(binaryMat);

    const skeletonMat = createSkeletonImage(morphMat);

    // ★ここにChatGPTの外枠消去コードを挟み込みます！
    cv.rectangle(
        skeletonMat,
        new cv.Point(0, 0),
        new cv.Point(skeletonMat.cols, skeletonMat.rows),
        new cv.Scalar(0),
        30 // 外周15pxを真っ黒にして罠を解除！
    );

    detectAngles(skeletonMat);

}

function drawSource(){

    const ctx =
        srcCanvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        srcCanvas.width,
        srcCanvas.height
    );

    ctx.drawImage(
        currentImage,
        0,
        0
    );

}

function createBinaryImage(){

    const srcCanvas =
        document.getElementById("srcCanvas");

    let src =
        cv.imread(srcCanvas);

    let hsv =
        new cv.Mat();

    cv.cvtColor(
        src,
        hsv,
        cv.COLOR_RGBA2RGB
    );

    cv.cvtColor(
        hsv,
        hsv,
        cv.COLOR_RGB2HSV
    );

    const hMin =
        parseInt(document.getElementById("hMin").value);

    const hMax =
        parseInt(document.getElementById("hMax").value);

    const sMin =
        parseInt(document.getElementById("sMin").value);

    const vMin =
        parseInt(document.getElementById("vMin").value);

    let lower =
        new cv.Mat(
            hsv.rows,
            hsv.cols,
            hsv.type(),
            [
                hMin/2,
                sMin*2.55,
                vMin*2.55,
                0
            ]
        );

    let upper =
        new cv.Mat(
            hsv.rows,
            hsv.cols,
            hsv.type(),
            [
                hMax/2,
                255,
                255,
                255
            ]
        );

    let bgMask =
        new cv.Mat();

    cv.inRange(
        hsv,
        lower,
        upper,
        bgMask
    );

    let wireMask =
        new cv.Mat();

    cv.bitwise_not(
        bgMask,
        wireMask
    );

    cv.imshow(
        "binaryCanvas",
        wireMask
    );

    src.delete();
    hsv.delete();
    lower.delete();
    upper.delete();
    bgMask.delete();

    return wireMask;
}

function createMorphImage(binaryMat){

    const kernelSize =
        parseInt(
            document.getElementById("kernelSize").value
        );

    const iterations =
        parseInt(
            document.getElementById("iterations").value
        );

    let morph =
        binaryMat.clone();

    let kernel =
        cv.getStructuringElement(
            cv.MORPH_RECT,
            new cv.Size(
                kernelSize,
                kernelSize
            )
        );

    //
    // OPEN
    //

    cv.morphologyEx(
        morph,
        morph,
        cv.MORPH_OPEN,
        kernel,
        new cv.Point(-1,-1),
        iterations
    );

    //
    // CLOSE
    //

    cv.morphologyEx(
        morph,
        morph,
        cv.MORPH_CLOSE,
        kernel,
        new cv.Point(-1,-1),
        iterations
    );
    
    cv.imshow(
        "morphCanvas",
        morph
    );

    kernel.delete();

    binaryMat.delete();

    return morph;
}

function createSkeletonImage(morphMat){

    const skeletonMat =
        zhangSuenThinning(morphMat);
        
    console.log(
        morphMat.type()
    );
    
    cv.imshow(
        "skeletonCanvas",
        skeletonMat
    );

    morphMat.delete();
    return skeletonMat;
}

function zhangSuenThinning(src){

    let img = src.clone();

    const rows = img.rows;
    const cols = img.cols;

    let changed;

    do{

        changed = false;

        changed |= thinningIteration(
            img,
            rows,
            cols,
            0
        );

        changed |= thinningIteration(
            img,
            rows,
            cols,
            1
        );

    }while(changed);

    return img;
}

function thinningIteration(
    img,
    rows,
    cols,
    iter
){

    const marker =
        new Uint8Array(rows * cols);

    let changed = false;

    const data = img.data;

    for(let y=1;y<rows-1;y++){

        for(let x=1;x<cols-1;x++){

            const p1 = y*cols+x;

            if(data[p1]===0)
                continue;

            const p2=data[(y-1)*cols+x];
            const p3=data[(y-1)*cols+x+1];
            const p4=data[y*cols+x+1];
            const p5=data[(y+1)*cols+x+1];
            const p6=data[(y+1)*cols+x];
            const p7=data[(y+1)*cols+x-1];
            const p8=data[y*cols+x-1];
            const p9=data[(y-1)*cols+x-1];

            const b =
                (p2>0)+(p3>0)+(p4>0)+
                (p5>0)+(p6>0)+(p7>0)+
                (p8>0)+(p9>0);

            if(b<2 || b>6)
                continue;

            const a =
                (p2===0&&p3>0)+
                (p3===0&&p4>0)+
                (p4===0&&p5>0)+
                (p5===0&&p6>0)+
                (p6===0&&p7>0)+
                (p7===0&&p8>0)+
                (p8===0&&p9>0)+
                (p9===0&&p2>0);

            if(a!==1)
                continue;

            if(iter===0){

                if(
                    (p2>0 && p4>0 && p6>0) ||
                    (p4>0 && p6>0 && p8>0)
                ){
                    continue;
                }

            }else{

                if(
                    (p2>0 && p4>0 && p8>0) ||
                    (p2>0 && p6>0 && p8>0)
                ){
                    continue;
                }
            }

            marker[p1]=1;
        }
    }

    for(let i=0;i<marker.length;i++){

        if(marker[i]){

            data[i]=0;
            changed=true;
        }
    }

    return changed;
}

function detectAngles(skeletonMat){

    const hist =
        buildAngleHistogram(skeletonMat);

    const candidates =
        findAngleCandidates(hist);

    const best =
        evaluateAngles(
            skeletonMat,
            candidates
        );

    document.getElementById("thetaA").textContent =best[0].theta;
    document.getElementById("thetaB").textContent =best[1].theta;
    document.getElementById("pitchA").textContent =best[0].pitch;
    document.getElementById("pitchB").textContent =best[1].pitch;
    
    skeletonMat.delete();
}

function buildAngleHistogram(mat){

    const hist = new Array(180).fill(0);

    const w = mat.cols;
    const h = mat.rows;
    const d = mat.data;

    const border = 10;

    const points = [];

    for(let y=border;y<h-border;y++){

        for(let x=border;x<w-border;x++){

            if(d[y*w+x]>0){

                points.push({x,y});
            }
        }
    }

    const maxDist = 12;

    for(let i=0;i<points.length;i++){

        const p1 = points[i];

        for(let j=i+1;j<points.length;j++){

            const p2 = points[j];

            const dx = p2.x-p1.x;
            const dy = p2.y-p1.y;

            const dist2 =
                dx*dx+dy*dy;

            if(
                dist2<4 ||
                dist2>maxDist*maxDist
            ){
                continue;
            }

            let ang =
                Math.atan2(dy,dx)*
                180/Math.PI;

            ang =
                Math.round(
                    (ang+180)%180
                );

            hist[ang]++;
        }
    }

    return smoothHistogram(
        hist,
        5
    );
}

function smoothHistogram(
    hist,
    radius
){

    const out =
        new Array(hist.length).fill(0);

    for(let i=0;i<hist.length;i++){

        let sum=0;
        let cnt=0;

        for(
            let k=-radius;
            k<=radius;
            k++
        ){

            const idx =
                (i+k+180)%180;

            sum += hist[idx];
            cnt++;
        }

        out[i]=sum/cnt;
    }

    return out;
}
    
function findAnglePeaks(hist){

    const peaks=[];

    const tmp=
        hist.map(
            (v,i)=>({a:i,v})
        );

    tmp.sort(
        (a,b)=>b.v-a.v
    );

    for(const p of tmp){

        let ok=true;

        for(const q of peaks){

            let d=
                Math.abs(p.a-q);

            d=Math.min(d,180-d);

            if(d<40){

                ok=false;
                break;
            }
        }

        if(ok){

            peaks.push(p.a);
        }

        if(peaks.length===2){

            break;
        }
    }

    return peaks;
}

// ========================================================
// 🚀 【Part5核心】角度の組み合わせを総当たりテストして厳選する関数
// ========================================================
function evaluateAngles(skeletonMat, candidates) {
    let bestPair = null;
    let maxScore = -1;

    // 候補として集まった角度の中から「2つの組み合わせ」を総当たりでテスト！
    for (let i = 0; i < candidates.length; i++) {
        for (let j = i + 1; j < candidates.length; j++) {
            const theta1 = candidates[i];
            const theta2 = candidates[j];

            // 💡 角度同士が近すぎるもの（ハシゴ線ノイズ同士など）は除外
            let diffAngle = Math.abs(theta1 - theta2);
            diffAngle = Math.min(diffAngle, 180 - diffAngle);
            if (diffAngle < 40) continue; 

            // それぞれの角度で ρ ヒストグラムを生成
            const hist1 = buildRhoHistogram(skeletonMat, theta1);
            const hist2 = buildRhoHistogram(skeletonMat, theta2);

            // 💡 それぞれの角度の「山（ピーク）」を探す（ここで20px未満のノイズを弾く！）
            const peaks1 = findRhoPeaks(hist1, 20); // ← ★これがMIN_RHO_SPACING=20
            const peaks2 = findRhoPeaks(hist2, 20);

            // ピッチ（網の目の幅）を計算
            const pitch1 = estimatePitch(peaks1);
            const pitch2 = estimatePitch(peaks2);

            // ちゃんと網の目として成立しているかチェック（20px〜80pxの間か）
            if (pitch1 < 20 || pitch1 > 80 || pitch2 < 20 || pitch2 > 80) continue;

            // 周期がどれくらい綺麗に並んでいるかのスコア（山の数が多いほど優秀）
            const score = peaks1.length + peaks2.length;

            if (score > maxScore) {
                maxScore = score;
                bestPair = [
                    { theta: theta1, pitch: pitch1 },
                    { theta: theta2, pitch: pitch2 }
                ];
            }
        }
    }

    // もし良いペアが見つからなかった場合のセーフティ
    if (!bestPair) {
        return [
            { theta: "--", pitch: "--" },
            { theta: "--", pitch: "--" }
        ];
    }

    // θA（小さい方の角度）と θB（大きい方の角度）になるように並び替えて戻す
    bestPair.sort((a, b) => a.theta - b.theta);
    return bestPair;
}

// ========================================================
// 📦 【新規追加】ρヒストグラムのギザギザから「本物の山」だけを抽出する関数
// ========================================================
function findRhoPeaks(hist, minSpacing) {
    const peaks = [];
    
    // ローカルな山（周囲より高い場所）を全探索
    for (let r = 2; r < hist.length - 2; r++) {
        if (hist[r] > hist[r-1] && hist[r] > hist[r-2] &&
            hist[r] > hist[r+1] && hist[r] > hist[r+2] && hist[r] > 10) {
            
            // 💡 近すぎる山（20px未満）がないかチェックして、罠を解除する処理！
            let tooClose = false;
            for (const p of peaks) {
                if (Math.abs(r - p) < minSpacing) { // ← ★これが探していた Math.abs です！
                    tooClose = true;
                    break;
                }
            }
            if (!tooClose) {
                peaks.push(r);
            }
        }
    }
    return peaks;
}
    
function findAngleCandidates(hist){

    const peaks=[];

    const tmp=
        hist.map(
            (v,i)=>({a:i,v})
        );

    tmp.sort(
        (a,b)=>b.v-a.v
    );

    for(const p of tmp){

        let ok=true;

        for(const q of peaks){

            let d=
                Math.abs(
                    p.a-q
                );

            d=
                Math.min(
                    d,
                    180-d
                );

            if(d<20){

                ok=false;
                break;
            }
        }

        if(ok){

            peaks.push(p.a);
        }

        if(peaks.length===8)
            break;
    }

    return peaks;
}

function evaluateAngles(angleResult){

    const pitch = estimatePitch(angleResult.rhos);

    // ★ミクロ周期は失格
    if(pitch < 20){
        return 0;
    }

    if(pitch > 80){
        return 0;
    }

    return angleResult.peaks.length;
}

function buildRhoHistogram(
    mat,
    thetaDeg
){

    const w=mat.cols;
    const h=mat.rows;

    const d=mat.data;

    const theta=
        thetaDeg*
        Math.PI/180;

    const ct=
        Math.cos(theta);

    const st=
        Math.sin(theta);

    const rhoMax=
        Math.ceil(
            Math.sqrt(
                w*w+h*h
            )
        );

    const hist=
        new Array(
            rhoMax*2+1
        ).fill(0);

    for(let y=0;y<h;y++){

        for(let x=0;x<w;x++){

            if(
                d[y*w+x]===0
            ) continue;

            const rho=
                Math.round(
                    x*ct+y*st
                );

            hist[
                rho+rhoMax
            ]++;
        }
    }

    return hist;
}

function estimatePitch(rhoList){

    if(rhoList.length < 4){
        return 0;
    }

    rhoList.sort((a,b)=>a-b);

    const diffs = [];

    for(let i=1;i<rhoList.length;i++){

        const d = rhoList[i]-rhoList[i-1];

        // ★重要
        if(d < 20) continue;
        if(d > 80) continue;

        diffs.push(d);
    }

    if(diffs.length===0){
        return 0;
    }

    diffs.sort((a,b)=>a-b);

    return diffs[Math.floor(diffs.length/2)];
}

</script>

</body>
</html>
