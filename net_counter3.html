<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>網の直線検出（クラスタリング修正版）</title>
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>
    <h2>網の直線検出（ダブリ徹底排除版）</h2>
    <input type="file" id="fileInput" accept="image/*"><br><br>
    
    <div>
        <canvas id="canvasInput" style="max-width: 400px;"></canvas>
        <canvas id="canvasOutput" style="max-width: 400px;"></canvas>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', (e) => {
            let imgElement = document.getElementById('canvasInput');
            let ctx = imgElement.getContext('2d');
            let reader = new FileReader();
            
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    imgElement.width = img.width;
                    imgElement.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    if (typeof cv !== 'undefined' && cv.Mat) { 
                        processImageFinal(); 
                    } else {
                        alert("OpenCV.js読み込み中...");
                    }
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        function processImageFinal() {
            let src = cv.imread('canvasInput');
            let hsv = new cv.Mat();
            let mask = new cv.Mat();
            let dst = src.clone();

            // 1. グリーンバック除去
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
            let lowGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [35, 35, 35, 0]);
            let highGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [90, 255, 255, 255]);
            cv.inRange(hsv, lowGreen, highGreen, mask);
            cv.bitwise_not(mask, mask);

            // 2. クロージング（線の中の細かい穴を埋める）
            let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
            cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernel);

            // 3. ハフ変換（細切れになってもいいので、弛んだカーブを網羅的に拾う）
            let lines = new cv.Mat();
            // 閾値: 35, 最小線長: 40, 最大隙間: 60
            cv.HoughLinesP(mask, lines, 1, Math.PI / 180, 35, 40, 60);

            // 青（右肩上がり）と オレンジ（右肩下がり）のグループを最初に完全セパレート
            let blueLines = [];
            let orangeLines = [];

            let midY = Math.round(src.rows / 2);

            // 4. 一次振り分けと「画像中央のX座標（centerX）」の計算
            for (let i = 0; i < lines.rows; ++i) {
                let x1 = lines.data32S[i * 4];
                let y1 = lines.data32S[i * 4 + 1];
                let x2 = lines.data32S[i * 4 + 2];
                let y2 = lines.data32S[i * 4 + 3];

                let angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
                if (angle > 90) angle -= 180;
                if (angle < -90) angle += 180;

                // 縦線・横線のノイズカット
                if (Math.abs(angle) < 50 || Math.abs(angle) > 85) continue;

                let a = (x2 - x1) !== 0 ? (y2 - y1) / (x2 - x1) : 9999;
                let b = y1 - a * x1;
                let centerX = (midY - b) / a;

                // 傾きの正負で完全に配列を分ける（これで青とオレンジが絶対混ざらない）
                if (a < 0) {
                    blueLines.push({ x1, y1, x2, y2, a, b, centerX });
                } else {
                    orangeLines.push({ x1, y1, x2, y2, a, b, centerX });
                }
            }

            // 本格的なクラスタリング（近接する線を1本にマージする関数）
            function clusterAndFit(targetLines, threshold) {
                let mergedGroups = [];

                targetLines.forEach(line => {
                    let matchedGroup = null;
                    for (let group of mergedGroups) {
                        // グループの平均centerXとの距離を比較
                        if (Math.abs(group.avgCenterX - line.centerX) < threshold) {
                            matchedGroup = group;
                            break;
                        }
                    }

                    if (matchedGroup) {
                        matchedGroup.lines.push(line);
                        // 平均中心位置を更新
                        let sumX = 0;
                        matchedGroup.lines.forEach(l => sumX += l.centerX);
                        matchedGroup.avgCenterX = sumX / matchedGroup.lines.length;
                    } else {
                        mergedGroups.push({
                            avgCenterX: line.centerX,
                            lines: [line]
                        });
                    }
                });

                return mergedGroups;
            }

            // 【重要】ダブリを殺すためのクラスタリング実行（距離閾値は実績ベースの60に設定）
            const CLUSTER_THRESHOLD = 60;
            let blueGroups = clusterAndFit(blueLines, CLUSTER_THRESHOLD);
            let orangeGroups = clusterAndFit(orangeLines, CLUSTER_THRESHOLD);

            // 5. 最小二乗法で1本の直線にして描画する関数
            function drawGroupedLines(groups, isOrange) {
                groups.forEach(group => {
                    let points = [];
                    group.lines.forEach(l => {
                        points.push({ x: l.x1, y: l.y1 });
                        points.push({ x: l.x2, y: l.y2 });
                    });

                    if (points.length < 2) return;

                    // 最小二乗法によるフィット
                    let n = points.length;
                    let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                    points.forEach(p => {
                        sumX += p.x; sumY += p.y;
                        sumXY += p.x * p.y; sumXX += p.x * p.x;
                    });

                    let fitA = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
                    let fitB = (sumY - fitA * sumX) / n;

                    let startY = 0;
                    let startX = Math.round((startY - fitB) / fitA);
                    let endY = dst.rows;
                    let endX = Math.round((endY - fitB) / fitA);

                    let color = isOrange ? new cv.Scalar(255, 140, 0, 255) : new cv.Scalar(0, 100, 255, 255);
                    cv.line(dst, new cv.Point(startX, startY), new cv.Point(endX, endY), color, 3);
                });
            }

            // 青グループとオレンジグループをそれぞれ描画
            drawGroupedLines(blueGroups, false);
            drawGroupedLines(orangeGroups, true);

            cv.imshow('canvasOutput', dst);

            // メモリ解放
            src.delete(); hsv.delete(); mask.delete(); dst.delete();
            lines.delete(); kernel.delete(); lowGreen.delete(); highGreen.delete();
        }
    </script>
</body>
</html>
