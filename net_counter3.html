<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>網の直線検出（2枚目完全再現版）</title>
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>
    <h2>網の検出（ハフ変換不使用・忠実再現プロトタイプ）</h2>
    <input type="file" id="fileInput" accept="image/*"><br><br>
    
    <div>
        <canvas id="canvasInput" style="max-width: 400px;"></canvas>
        <canvas id="canvasOutput" style="max-width: 400px;"></canvas>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', (e) => {
            let imgElement = document.getElementById('canvasInput');
            let ctx = imgElement.getContext('2d');
            let reader = new FileReader();
            
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    imgElement.width = img.width;
                    imgElement.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    if (typeof cv !== 'undefined' && cv.Mat) { 
                        processImageFaithful(); 
                    } else {
                        alert("OpenCV.js読み込み中...");
                    }
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        function processImageFaithful() {
            let src = cv.imread('canvasInput');
            let hsv = new cv.Mat();
            let mask = new cv.Mat();
            let dst = src.clone();

            // 1. グリーンバック除去（二二値化）
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
            let lowGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [35, 35, 35, 0]);
            let highGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [90, 255, 255, 255]);
            cv.inRange(hsv, lowGreen, highGreen, mask);
            cv.bitwise_not(mask, mask); // 網を白（255）、背景を黒（0）に

            // 2. クロージングで網のねじれ穴を完全に埋めて「1本の滑らかな太い紐」にする
            let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
            cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernel);

            // 3. 【最重要】輪郭抽出（Contours）による網のコード単体の分離
            // ハフ変換を一切使わず、つながっている「白い紐のかたまり」として網を認識します
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(mask, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_NONE);

            // 4. 抽出した「紐」ごとに、端から端まで突き抜ける1本の近似直線を計算
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);

                // 小さすぎるノイズ（ゴミ）は無視（面積が300ピクセル未満は除外）
                if (area < 300) { cnt.delete(); continue; }

                // fitLineを使って、この網の輪郭の点群に最も綺麗にフィットする直線（方向ベクトル）を計算
                let lineMat = new cv.Mat();
                cv.fitLine(cnt, lineMat, cv.DIST_L2, 0, 0.01, 0.01);

                // 直線のパラメータ（方向ベクトルvx, vy と 通る点x0, y0）を取得
                let vx = lineMat.data32F[0];
                let vy = lineMat.data32F[1];
                let x0 = lineMat.data32F[2];
                let y0 = lineMat.data32F[3];

                // 傾きを計算
                let slope = vy / vx;

                // 横線や縦線のノイズ（画像の端の影など）をカット（斜め45〜85度のみを対象にする）
                let angle = Math.atan2(vy, vx) * 180 / Math.PI;
                if (Math.abs(angle) < 45 || Math.abs(angle) > 85) {
                    lineMat.delete(); cnt.delete(); continue;
                }

                // 切片を計算 (y = ax + b -> b = y0 - slope * x0)
                let b = y0 - slope * x0;

                // 画像の最上部（y=0）と最下部（y=rows）のX座標を計算して、端から端まで突き抜く
                let startY = 0;
                let startX = Math.round((startY - b) / slope);
                let endY = dst.rows;
                let endX = Math.round((endY - b) / slope);

                // 5. 2枚目の理想図通りに完璧に色分け（右肩下がり＝オレンジ、右肩上がり＝青）
                let color;
                if (slope > 0) {
                    color = new cv.Scalar(255, 140, 0, 255); // オレンジ
                } else {
                    color = new cv.Scalar(0, 100, 255, 255);  // 青
                }

                // 2枚目のように、網1本に対して完全に独立した1本の線を引く
                cv.line(dst, new cv.Point(startX, startY), new cv.Point(endX, endY), color, 4);

                lineMat.delete();
                cnt.delete();
            }

            // 結果を表示
            cv.imshow('canvasOutput', dst);

            // メモリ解放
            src.delete(); hsv.delete(); mask.delete(); dst.delete();
            contours.delete(); hierarchy.delete(); kernel.delete();
            lowGreen.delete(); highGreen.delete();
        }
    </script>
</body>
</html>
