<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>網段数カウンター v3</title>
<style>
  :root{
    --bg:#0a0f0a;--panel:#111a11;--border:#1e3a1e;
    --green:#00e676;--amber:#ffab00;--red:#ff1744;
    --text:#c8e6c9;--text-dim:#558b5e;--green-dark:#004d20;
    --font:'Courier New',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);
    height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    user-select:none;-webkit-user-select:none}
  #header{display:flex;align-items:center;justify-content:space-between;
    padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);
    flex-shrink:0;gap:8px}
  #header h1{font-size:13px;letter-spacing:.15em;color:var(--green);
    text-transform:uppercase;white-space:nowrap}
  .sdot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);
    flex-shrink:0;transition:background .2s}
  .sdot.on{background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 1.5s infinite}
  .sdot.lock{background:var(--amber);box-shadow:0 0 6px var(--amber)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

  #cam{position:relative;flex:1;overflow:hidden;background:#000}
  #video{width:100%;height:100%;object-fit:cover;display:block}
  #ov{position:absolute;inset:0;pointer-events:none}
  #gcv{position:absolute;right:0;top:0;bottom:0;width:64px;opacity:.9}

  #topbar{position:absolute;top:0;left:0;right:64px;height:5px;background:rgba(0,0,0,.4)}
  #topbar-inner{height:100%;width:0%;background:var(--green);transition:width .05s}

  #wl{position:absolute;left:0;right:64px;height:2px;top:50%;
    transform:translateY(-50%);pointer-events:none}
  .wl-bar{position:absolute;inset:0;background:var(--green);opacity:.9;
    box-shadow:0 0 8px var(--green);transition:all .1s}
  .wl-bar.hit{background:var(--amber);box-shadow:0 0 20px var(--amber),0 0 40px var(--amber)}
  .wl-lbl{position:absolute;right:8px;top:4px;font-size:10px;
    color:var(--green);letter-spacing:.1em}

  #flash{position:absolute;inset:0;background:rgba(0,230,118,.18);
    opacity:0;pointer-events:none;transition:opacity .05s}
  #lock-ind{position:absolute;left:8px;top:50%;transform:translateY(-50%);
    font-size:10px;color:var(--amber);letter-spacing:.1em;opacity:0;
    background:rgba(0,0,0,.6);padding:2px 6px;border-radius:3px;transition:opacity .2s}
  #lock-ind.show{opacity:1}

  #bottom{background:var(--panel);border-top:1px solid var(--border);flex-shrink:0}
  #count-row{display:flex;align-items:center;justify-content:center;
    padding:8px 14px 4px;gap:16px}
  #cnt{font-size:64px;font-weight:700;color:var(--green);letter-spacing:-2px;
    line-height:1;text-shadow:0 0 20px rgba(0,230,118,.4);
    transition:color .1s;min-width:3ch;text-align:center}
  #cnt.bump{color:#fff;text-shadow:0 0 30px rgba(0,230,118,.8)}
  .clbl{font-size:11px;color:var(--text-dim);letter-spacing:.12em;
    text-transform:uppercase;line-height:1.4}
  #mrow{display:flex;padding:4px 14px 6px;gap:6px}
  .mc{flex:1;background:var(--green-dark);border:1px solid var(--border);
    border-radius:4px;padding:5px 8px;text-align:center}
  .mv{font-size:15px;color:var(--text);line-height:1}
  .ml{font-size:9px;color:var(--text-dim);letter-spacing:.1em;
    text-transform:uppercase;margin-top:2px}
  #brow{display:flex;gap:8px;padding:0 14px 8px}
  .btn{flex:1;padding:9px 4px;border:1px solid var(--border);border-radius:6px;
    background:transparent;color:var(--text-dim);font-family:var(--font);
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:all .15s}
  .btn:active{transform:scale(.96)}
  .btn.pri{border-color:var(--green);color:var(--green);background:rgba(0,230,118,.07)}
  .btn.danger{border-color:var(--red);color:var(--red)}
  .btn.on{border-color:var(--green);color:var(--green)}
  #ppanel{padding:0 14px 8px;display:none;flex-direction:column;gap:5px;
    max-height:52vh;overflow-y:auto}
  #ppanel.open{display:flex}
  .pr{display:flex;align-items:center;gap:8px}
  .pl{font-size:10px;color:var(--text-dim);letter-spacing:.1em;
    width:130px;flex-shrink:0;text-transform:uppercase}
  input[type=range]{flex:1;accent-color:var(--green);height:3px}
  .pv{font-size:12px;color:var(--green);width:38px;text-align:right}
  .psec{font-size:9px;color:var(--amber);letter-spacing:.15em;
    text-transform:uppercase;margin-top:4px;margin-bottom:2px;
    border-top:1px solid var(--border);padding-top:5px}
</style>
</head>
<body>

<div id="header">
  <div class="sdot" id="sdot"></div>
  <h1>網段数 v3 / 交点検出</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <span style="font-size:11px;color:var(--text-dim)" id="fps-lbl">--fps</span>
    <button class="btn" id="btn-adj"
      style="flex:none;padding:4px 10px;font-size:10px">⚙ 調整</button>
  </div>
</div>

<div id="cam">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="ov" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
  <canvas id="gcv"></canvas>
  <div id="topbar"><div id="topbar-inner"></div></div>
  <div id="wl">
    <div class="wl-bar" id="wl-bar"></div>
    <div class="wl-lbl">WATCH LINE</div>
  </div>
  <div id="flash"></div>
  <div id="lock-ind">■ LOCKED</div>
</div>

<div id="bottom">
  <div id="ppanel">
    <!-- グリーンバック -->
    <div class="psec">▸ グリーンバック検出</div>
    <div class="pr">
      <span class="pl">緑H下限</span>
      <input type="range" id="p-hmin" min="60" max="130" value="85">
      <span class="pv" id="v-hmin">85</span>
    </div>
    <div class="pr">
      <span class="pl">緑H上限</span>
      <input type="range" id="p-hmax" min="140" max="200" value="165">
      <span class="pv" id="v-hmax">165</span>
    </div>
    <div class="pr">
      <span class="pl">彩度下限</span>
      <input type="range" id="p-smin" min="5" max="60" value="20">
      <span class="pv" id="v-smin">20</span>
    </div>
    <!-- Hough -->
    <div class="psec">▸ ワイヤ検出 (Hough)</div>
    <div class="pr">
      <span class="pl">累積閾値</span>
      <input type="range" id="p-hthr" min="5" max="80" value="25">
      <span class="pv" id="v-hthr">25</span>
    </div>
    <div class="pr">
      <span class="pl">角度許容差(°)</span>
      <input type="range" id="p-atol" min="3" max="30" value="18">
      <span class="pv" id="v-atol">18</span>
    </div>
    <!-- 交点 -->
    <div class="psec">▸ 交点検出</div>
    <div class="pr">
      <span class="pl">重複統合距離px</span>
      <input type="range" id="p-mdst" min="2" max="40" value="10">
      <span class="pv" id="v-mdst">10</span>
    </div>
    <div class="pr">
      <span class="pl">交点最小スコア</span>
      <input type="range" id="p-mscr" min="1" max="10" value="2">
      <span class="pv" id="v-mscr">2</span>
    </div>
    <!-- 行クラスタ -->
    <div class="psec">▸ 行クラスタリング</div>
    <div class="pr">
      <span class="pl">ΔY 許容px</span>
      <input type="range" id="p-rtol" min="3" max="40" value="12">
      <span class="pv" id="v-rtol">12</span>
    </div>
    <div class="pr">
      <span class="pl">最小点数/行</span>
      <input type="range" id="p-rmin" min="1" max="12" value="3">
      <span class="pv" id="v-rmin">3</span>
    </div>
    <!-- カウント -->
    <div class="psec">▸ カウント制御</div>
    <div class="pr">
      <span class="pl">トリガー段数</span>
      <input type="range" id="p-trig" min="1" max="15" value="3">
      <span class="pv" id="v-trig">3</span>
    </div>
    <div class="pr">
      <span class="pl">UNLOCK段数</span>
      <input type="range" id="p-unlk" min="0" max="10" value="1">
      <span class="pv" id="v-unlk">1</span>
    </div>
  </div>

  <div id="count-row">
    <div>
      <div class="clbl">段数</div>
      <div class="clbl" style="color:var(--text-dim);font-size:9px">ROWS</div>
    </div>
    <div id="cnt">0</div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <button class="btn danger" id="btn-rst" style="padding:6px 12px">RESET</button>
      <button class="btn" id="btn-m1"  style="padding:6px 12px">-1</button>
    </div>
  </div>

  <div id="mrow">
    <div class="mc"><div class="mv" id="m-xpts">0</div><div class="ml">交点数</div></div>
    <div class="mc"><div class="mv" id="m-rows">0</div><div class="ml">検出段</div></div>
    <div class="mc"><div class="mv" id="m-state">WAIT</div><div class="ml">状態</div></div>
    <div class="mc"><div class="mv" id="m-intv">--</div><div class="ml">間隔(s)</div></div>
  </div>

  <div id="brow">
    <button class="btn pri" id="btn-start">▶ カメラ開始</button>
    <button class="btn" id="btn-vis">交点表示</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  パラメータ
// ══════════════════════════════════════════
const P = {
  hMin:85, hMax:165, sMin:20,   // 緑HSV
  houghThr:25, angleTol:18,      // Hough
  mergeDist:10, minScore:2,      // 交点
  rowTol:12, rowMin:3,           // 行クラスタ
  trigRows:3, unlockRows:1,      // カウント
};

const S = {
  running:false, count:0,
  phase:'WAIT', lastCountTime:0,
  showVis:false,
  fc:0, fpsT:0,
};

const GHIST = 120;
const gHist = new Float32Array(GHIST);
let gIdx = 0;

const video    = document.getElementById('video');
const ovEl     = document.getElementById('ov');
const octx     = ovEl.getContext('2d');
const gcv      = document.getElementById('gcv');
const gctx     = gcv.getContext('2d');
const wlBar    = document.getElementById('wl-bar');
const flashEl  = document.getElementById('flash');
const lockInd  = document.getElementById('lock-ind');
const sdot     = document.getElementById('sdot');
const cntEl    = document.getElementById('cnt');
const fpsLbl   = document.getElementById('fps-lbl');
const topbarIn = document.getElementById('topbar-inner');
const mXpts    = document.getElementById('m-xpts');
const mRows    = document.getElementById('m-rows');
const mState   = document.getElementById('m-state');
const mIntv    = document.getElementById('m-intv');

const proc  = document.createElement('canvas');
const pctx  = proc.getContext('2d', {willReadFrequently:true});

// ══════════════════════════════════════════
//  カメラ起動
// ══════════════════════════════════════════
let started = false;
document.getElementById('btn-start').addEventListener('click', async () => {
  if (started) return; started = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}
    });
    video.srcObject = stream; await video.play();
    S.running = true; sdot.className = 'sdot on';
    document.getElementById('btn-start').textContent = '■ 停止';
    document.getElementById('btn-start').classList.remove('pri');
    requestAnimationFrame(loop);
  } catch(e){ alert('カメラエラー: '+e.message); started=false; }
});

// ══════════════════════════════════════════
//  メインループ
// ══════════════════════════════════════════
function loop(ts){
  if (!S.running) return;
  requestAnimationFrame(loop);

  S.fc++;
  if (ts - S.fpsT > 1000){
    fpsLbl.textContent = S.fc + 'fps';
    S.fc = 0; S.fpsT = ts;
  }
  if (video.readyState < 2) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;

  const dw = video.clientWidth, dh = video.clientHeight;
  if (ovEl.width !== dw || ovEl.height !== dh){
    ovEl.width = dw; ovEl.height = dh;
    gcv.width = 64; gcv.height = dh;
  }

  // 処理解像度（速度と精度のバランス）
  const PW = 240, PH = Math.round(vh/vw*PW);
  proc.width = PW; proc.height = PH;
  pctx.drawImage(video, 0, 0, PW, PH);
  const imgData = pctx.getImageData(0, 0, PW, PH);

  // ── STEP1: ワイヤマスク ──
  const wireMask = buildWireMask(imgData, PW, PH);

  // ── STEP2+3: Houghでワイヤ群抽出 ──
  const {fLines, bLines} = extractWireLines(wireMask, PW, PH);

  // ── STEP4: 交点候補生成 ──
  const candidates = computeIntersections(fLines, bLines, PW, PH);

  // ── STEP5: 重複統合 ──
  const merged = mergeClusters(candidates, P.mergeDist);

  // ── STEP6: 行クラスタリング ──
  const rows = clusterRows(merged, P.rowTol, P.rowMin);

  // ── STEP7: WATCH LINE検出 ──
  const WY = PH / 2;
  const band = P.rowTol + 4;
  let wlRows = 0;
  for (const row of rows){
    if (Math.abs(row.yMean - WY) <= band) wlRows++;
  }

  detectCount(wlRows);

  // UI更新
  gHist[gIdx % GHIST] = wlRows; gIdx++;
  mXpts.textContent  = merged.length;
  mRows.textContent  = rows.length;
  mState.textContent = S.phase;
  const barPct = Math.min(100, wlRows / Math.max(P.trigRows*2,1) * 100);
  topbarIn.style.width      = barPct + '%';
  topbarIn.style.background = wlRows >= P.trigRows ? 'var(--amber)' : 'var(--green)';

  drawOverlay(dw, dh, PW, PH, candidates, merged, rows, WY, band);
  drawGraph(dh, wlRows);
}

// ══════════════════════════════════════════
//  STEP1: HSV → ワイヤマスク
// ══════════════════════════════════════════
function buildWireMask(imgData, w, h){
  const d = imgData.data;
  const mask = new Uint8Array(w * h);
  const hl = P.hMin, hh = P.hMax, sl = P.sMin / 100;
  for (let i = 0; i < w*h; i++){
    const r = d[i*4]/255, g = d[i*4+1]/255, b = d[i*4+2]/255;
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b), delta = mx - mn;
    if (delta < 0.01 || mx < 0.15){ mask[i] = 1; continue; } // 暗い→ワイヤ
    let hue = 0;
    if      (mx === g) hue = 60*((b-r)/delta) + 120;
    else if (mx === r) hue = (60*((g-b)/delta) + 360) % 360;
    else               hue = 60*((r-g)/delta) + 240;
    const sat = delta / mx;
    // 緑でなければワイヤ
    if (!(hue >= hl && hue <= hh && sat >= sl)) mask[i] = 1;
  }
  return mask;
}

// ══════════════════════════════════════════
//  STEP2+3: 簡易Houghでワイヤ直線群抽出
//  ／方向(fLines) と ＼方向(bLines) を分離
// ══════════════════════════════════════════
function extractWireLines(mask, w, h){
  const TSTEP = 1; // 1度刻み
  const diagLen = Math.ceil(Math.sqrt(w*w+h*h));
  const rhoOff  = diagLen;
  const rhoSize = diagLen * 2 + 1;
  const AT = P.angleTol;

  // ／方向: 40〜80° (右上がり)
  // ＼方向: 100〜140° (右下がり)
  const fRange = []; for(let t=40-AT;t<=80+AT;t+=TSTEP) fRange.push(t);
  const bRange = []; for(let t=100-AT;t<=140+AT;t+=TSTEP) bRange.push(t);

  // cos/sinテーブル
  const cosT = {}, sinT = {};
  [...fRange,...bRange].forEach(t=>{
    const r = t*Math.PI/180;
    cosT[t] = Math.cos(r); sinT[t] = Math.sin(r);
  });

  const fAcc = new Int32Array(fRange.length * rhoSize);
  const bAcc = new Int32Array(bRange.length * rhoSize);

  const step = 2; // 間引き
  for(let y=0;y<h;y+=step){
    for(let x=0;x<w;x+=step){
      if(!mask[y*w+x]) continue;
      fRange.forEach((t,ti)=>{
        const rho = Math.round(x*cosT[t]+y*sinT[t]) + rhoOff;
        if(rho>=0&&rho<rhoSize) fAcc[ti*rhoSize+rho]++;
      });
      bRange.forEach((t,ti)=>{
        const rho = Math.round(x*cosT[t]+y*sinT[t]) + rhoOff;
        if(rho>=0&&rho<rhoSize) bAcc[ti*rhoSize+rho]++;
      });
    }
  }

  const thr = Math.max(3, P.houghThr / (step*step));
  const fLines = peakLines(fAcc, fRange, rhoSize, rhoOff, thr);
  const bLines = peakLines(bAcc, bRange, rhoSize, rhoOff, thr);
  return {fLines, bLines};
}

function peakLines(acc, tRange, rhoSize, rhoOff, thr){
  const peaks = [];
  for(let ti=0;ti<tRange.length;ti++){
    for(let r=0;r<rhoSize;r++){
      const v = acc[ti*rhoSize+r];
      if(v >= thr) peaks.push({ti, r, v});
    }
  }
  peaks.sort((a,b)=>b.v-a.v);

  const used = new Set();
  const lines = [];
  const DR=5, DT=3;
  for(const pk of peaks){
    const key = `${pk.ti}_${pk.r}`;
    if(used.has(key)) continue;
    for(let dt=-DT;dt<=DT;dt++)
      for(let dr=-DR;dr<=DR;dr++)
        used.add(`${pk.ti+dt}_${pk.r+dr}`);
    const theta = tRange[pk.ti] * Math.PI / 180;
    const rho   = pk.r - rhoOff;
    lines.push({theta, rho, score:pk.v});
  }
  return lines;
}

// ══════════════════════════════════════════
//  STEP4: 交点候補生成
// ══════════════════════════════════════════
function computeIntersections(fLines, bLines, w, h){
  const pts = [];
  const mg = 5;
  for(const l1 of fLines){
    for(const l2 of bLines){
      const c1=Math.cos(l1.theta), s1=Math.sin(l1.theta);
      const c2=Math.cos(l2.theta), s2=Math.sin(l2.theta);
      const det = c1*s2 - c2*s1;
      if(Math.abs(det)<1e-6) continue;
      const x = (l1.rho*s2 - l2.rho*s1)/det;
      const y = (l2.rho*c1 - l1.rho*c2)/det;
      if(x<-mg||x>w+mg||y<-mg||y>h+mg) continue;
      const score = Math.min(l1.score, l2.score);
      if(score < P.minScore) continue;
      pts.push({x, y, score});
    }
  }
  return pts;
}

// ══════════════════════════════════════════
//  STEP5: 近傍統合
// ══════════════════════════════════════════
function mergeClusters(pts, dist){
  if(!pts.length) return [];
  const D2 = dist*dist;
  const used = new Uint8Array(pts.length);
  const result = [];
  for(let i=0;i<pts.length;i++){
    if(used[i]) continue;
    let sx=pts[i].x, sy=pts[i].y, sc=pts[i].score, n=1;
    used[i]=1;
    for(let j=i+1;j<pts.length;j++){
      if(used[j]) continue;
      const dx=pts[j].x-pts[i].x, dy=pts[j].y-pts[i].y;
      if(dx*dx+dy*dy<=D2){ sx+=pts[j].x; sy+=pts[j].y; sc+=pts[j].score; n++; used[j]=1; }
    }
    result.push({x:sx/n, y:sy/n, score:sc, n});
  }
  return result;
}

// ══════════════════════════════════════════
//  STEP6: 行クラスタリング (Y座標)
// ══════════════════════════════════════════
function clusterRows(pts, tol, minPts){
  if(!pts.length) return [];
  const sorted = [...pts].sort((a,b)=>a.y-b.y);
  const rows = [];
  let cur = [sorted[0]];
  for(let i=1;i<sorted.length;i++){
    if(sorted[i].y - cur[cur.length-1].y <= tol) cur.push(sorted[i]);
    else{ if(cur.length>=minPts) rows.push(cur); cur=[sorted[i]]; }
  }
  if(cur.length>=minPts) rows.push(cur);

  return rows.map(r=>{
    r.sort((a,b)=>a.x-b.x);
    const yMean = r.reduce((s,p)=>s+p.y,0)/r.length;
    return {pts:r, yMean};
  });
}

// ══════════════════════════════════════════
//  ステートマシン（v2と同じ構造）
// ══════════════════════════════════════════
function detectCount(wlRows){
  if(S.phase==='LOCKED'){
    if(wlRows<=P.unlockRows){
      S.phase='WAIT';
      wlBar.classList.remove('hit');
      lockInd.classList.remove('show');
      sdot.className='sdot on';
    }
    return;
  }
  if(wlRows>=P.trigRows) triggerCount();
}
function triggerCount(){
  const now = Date.now();
  if(S.lastCountTime>0) mIntv.textContent=((now-S.lastCountTime)/1000).toFixed(1);
  S.lastCountTime=now;
  S.count++; cntEl.textContent=S.count;
  S.phase='LOCKED';
  wlBar.classList.add('hit'); lockInd.classList.add('show');
  sdot.className='sdot lock';
  flashEl.style.opacity='1'; setTimeout(()=>flashEl.style.opacity='0',120);
  cntEl.classList.add('bump'); setTimeout(()=>cntEl.classList.remove('bump'),200);
}

// ══════════════════════════════════════════
//  オーバーレイ描画（v2スタイルを踏襲）
// ══════════════════════════════════════════
const ROW_COLORS=[
  'rgba(255,100,200,.85)','rgba(100,220,255,.85)',
  'rgba(255,220,60,.85)', 'rgba(100,255,150,.85)',
  'rgba(255,120,80,.85)', 'rgba(180,100,255,.85)',
];
function drawOverlay(dw,dh,PW,PH,candidates,merged,rows,WY,band){
  octx.clearRect(0,0,dw,dh);
  const sx=dw/PW, sy=dh/PH;

  // WATCH LINE帯域
  const cy=dh/2, bp=band*sy;
  octx.fillStyle='rgba(0,230,118,.06)';
  octx.fillRect(0,cy-bp,dw-64,bp*2);
  octx.strokeStyle='rgba(0,230,118,.25)';
  octx.lineWidth=1; octx.setLineDash([4,4]);
  octx.beginPath();
  octx.moveTo(0,cy-bp); octx.lineTo(dw-64,cy-bp);
  octx.moveTo(0,cy+bp); octx.lineTo(dw-64,cy+bp);
  octx.stroke(); octx.setLineDash([]);

  if(!S.showVis) return;

  // 候補点（黄色、小さめ）
  octx.fillStyle='rgba(255,220,0,.45)';
  for(const p of candidates){
    octx.beginPath();
    octx.arc(p.x*sx,p.y*sy,1.5,0,Math.PI*2);
    octx.fill();
  }

  // 段ごとに結線＋統合点
  for(let ri=0;ri<rows.length;ri++){
    const row=rows[ri];
    const inBand=Math.abs(row.yMean-WY)<=band;
    const col=inBand?'rgba(255,171,0,.9)':ROW_COLORS[ri%ROW_COLORS.length];

    // 結線
    if(row.pts.length>=2){
      octx.strokeStyle=col; octx.lineWidth=1.4; octx.setLineDash([]);
      octx.beginPath();
      octx.moveTo(row.pts[0].x*sx,row.pts[0].y*sy);
      for(let k=1;k<row.pts.length;k++)
        octx.lineTo(row.pts[k].x*sx,row.pts[k].y*sy);
      octx.stroke();
    }
    // 統合点（ピンク / WATCH LINE内はオレンジ）
    for(const p of row.pts){
      octx.fillStyle  = inBand?'#ff8c00':'#ff69b4';
      octx.strokeStyle='rgba(255,255,255,.6)';
      octx.lineWidth=1;
      octx.beginPath();
      octx.arc(p.x*sx,p.y*sy,inBand?5:3.5,0,Math.PI*2);
      octx.fill(); octx.stroke();
    }
  }
}

// ══════════════════════════════════════════
//  右端グラフ（v2と同じ）
// ══════════════════════════════════════════
function drawGraph(dh, wlRows){
  const pw=64;
  gctx.clearRect(0,0,pw,dh);
  gctx.fillStyle='rgba(0,0,0,.65)';
  gctx.fillRect(0,0,pw,dh);
  const rowH=dh/GHIST;
  let maxV=Math.max(P.trigRows*2,1);
  for(let i=0;i<GHIST;i++) if(gHist[i]>maxV) maxV=gHist[i];
  for(let i=0;i<GHIST;i++){
    const idx=(gIdx-GHIST+i+GHIST)%GHIST;
    const v=gHist[idx];
    const y=i*rowH, w=v/maxV*(pw-6);
    gctx.fillStyle=v>=P.trigRows?'#ffab00':'rgba(0,230,118,.6)';
    gctx.fillRect(2,y,w,Math.max(1,rowH-.5));
  }
  const tx=P.trigRows/maxV*(pw-6)+2;
  gctx.strokeStyle='rgba(255,171,0,.7)';
  gctx.lineWidth=1; gctx.setLineDash([3,3]);
  gctx.beginPath(); gctx.moveTo(tx,0); gctx.lineTo(tx,dh); gctx.stroke();
  gctx.setLineDash([]);
  gctx.fillStyle='rgba(85,139,94,.9)';
  gctx.font='9px Courier New';
  gctx.fillText('WL',2,11); gctx.fillText('ROWS',2,21);
}
