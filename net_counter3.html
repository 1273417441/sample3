<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>網の直線検出テスト（修正版）</title>
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>
    <h2>網の直線検出プロトタイプ</h2>
    <input type="file" id="fileInput" accept="image/*"><br><br>
    
    <div>
        <canvas id="canvasInput" style="max-width: 400px;"></canvas>
        <canvas id="canvasOutput" style="max-width: 400px;"></canvas>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', (e) => {
            let imgElement = document.getElementById('canvasInput');
            let ctx = imgElement.getContext('2d');
            let reader = new FileReader();
            
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    imgElement.width = img.width;
                    imgElement.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    if (typeof cv !== 'undefined' && cv.Mat) { 
                        processImageAdvanced(); 
                    } else {
                        alert("OpenCV.jsがまだ読み込み途中です。数秒待ってから画像を再選択してください。");
                    }
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        function processImageAdvanced() {
            let src = cv.imread('canvasInput');
            let hsv = new cv.Mat();
            let mask = new cv.Mat();
            let dst = src.clone();

            // 1. グリーンバック除去
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
            
            let lowGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [35, 35, 35, 0]);
            let highGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [90, 255, 255, 255]);
            cv.inRange(hsv, lowGreen, highGreen, mask);
            cv.bitwise_not(mask, mask); // 網を白に

            // 2. クロージング処理で途切れを結合
            let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
            cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernel);

            // 3. パラメータを調整したハフ変換（最初の安定していた設定ベース）
            let lines = new cv.Mat();
            cv.HoughLinesP(mask, lines, 1, Math.PI / 180, 60, 80, 80);

            // 4. 直線のグルーピング（1本化ロジック）
            let lineGroup = [];
            const ANGLE_THRESHOLD = 6;   // 同じ線とみなす傾きの許容差（度）
            const INTERCEPT_THRESHOLD = 35; // 【修正】画像の中央の高さ（y = rows/2）を通るx座標の許容ズレ（ピクセル）

            let midY = Math.round(src.rows / 2); // 判定の基準にする画像中央のY座標

            for (let i = 0; i < lines.rows; ++i) {
                let x1 = lines.data32S[i * 4];
                let y1 = lines.data32S[i * 4 + 1];
                let x2 = lines.data32S[i * 4 + 2];
                let y2 = lines.data32S[i * 4 + 3];

                // 傾き(a)と切片(b)を計算 (y = ax + b)
                let angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
                if (angle > 90) angle -= 180;
                if (angle < -90) angle += 180;

                // 明らかなノイズ（真横や真縦の線）をカット
                if (Math.abs(angle) < 45 || Math.abs(angle) > 85) continue;

                let a = (x2 - x1) !== 0 ? (y2 - y1) / (x2 - x1) : 9999;
                let b = y1 - a * x1;
                
                // 【解決策】符号の影響を受けない「画像中央を横切るときのx座標」をグループ判定の基準にする
                let centerX = (midY - b) / a;

                // 既存のグループに統合できるかチェック
                let matched = false;
                for (let group of lineGroup) {
                    if (Math.abs(group.angle - angle) < ANGLE_THRESHOLD && Math.abs(group.centerX - centerX) < INTERCEPT_THRESHOLD) {
                        group.lines.push({x1, y1, x2, y2, a, b});
                        matched = true;
                        break;
                    }
                }

                if (!matched) {
                    lineGroup.push({ angle, centerX, lines: [{x1, y1, x2, y2, a, b}] });
                }
            }

            // 5. 統合された線を描画
            lineGroup.forEach(group => {
                // グループ内のすべての線の平均の傾きと切片を算出
                let sumA = 0, sumB = 0;
                group.lines.forEach(l => {
                    sumA += l.a;
                    sumB += l.b;
                });
                let avgA = sumA / group.lines.length;
                let avgB = sumB / group.lines.length;

                // 画像の最上部(y=0)と最下部(y=rows)でのx座標を計算
                let startY = 0;
                let startX = Math.round((startY - avgB) / avgA);
                let endY = dst.rows;
                let endX = Math.round((endY - avgB) / avgA);

                // 角度で色分け（青 or オレンジ）
                let color = (group.angle > 0) ? new cv.Scalar(255, 165, 0, 255) : new cv.Scalar(0, 100, 255, 255);

                // 1本の綺麗な直線としてブチ抜いて描画
                cv.line(dst, new cv.Point(startX, startY), new cv.Point(endX, endY), color, 3);
            });

            // 結果を表示
            console.log("raw lines:", lines.rows);
            console.log("groups:", lineGroup.length);
            cv.imshow('canvasOutput', dst);

            // メモリ解放
            src.delete(); hsv.delete(); mask.delete(); dst.delete();
            lines.delete(); kernel.delete(); lowGreen.delete(); highGreen.delete();
        }
    </script>
</body>
</html>
