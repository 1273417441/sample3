<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>網の直線検出テスト（2枚目忠実再現版）</title>
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>
    <h2>網の直線検出プロトタイプ（角度分類・マージ実装）</h2>
    <input type="file" id="fileInput" accept="image/*"><br><br>
    
    <div>
        <canvas id="canvasInput" style="max-width: 400px;"></canvas>
        <canvas id="canvasOutput" style="max-width: 400px;"></canvas>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', (e) => {
            let imgElement = document.getElementById('canvasInput');
            let ctx = imgElement.getContext('2d');
            let reader = new FileReader();
            
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    imgElement.width = img.width;
                    imgElement.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    if (typeof cv !== 'undefined' && cv.Mat) { 
                        processImageFaithful(); 
                    } else {
                        alert("OpenCV.js読み込み中...");
                    }
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        function processImageFaithful() {
            let src = cv.imread('canvasInput');
            let hsv = new cv.Mat();
            let mask = new cv.Mat();
            let dst = src.clone();

            // 1. 【ご指摘の通り】背景のグリーンバック（緑色）を正確に抽出
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
            
            // 明るさのムラに対応するため、V（明度）の下限を20まで下げて背景の影も緑として拾う
            let lowGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [35, 40, 20, 0]);
            let highGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [90, 255, 255, 255]);
            cv.inRange(hsv, lowGreen, highGreen, mask);
            
            // 緑色背景を反転させることで、光沢の影響を受けずに「網のシルエット」だけを純粋に残す
            cv.bitwise_not(mask, mask);

            // 2. クロージング処理（網の内部に残ったわずかなノイズ穴を埋める）
            let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
            cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernel);

            // 3. ハフ変換（HoughLinesP）を実行
            let lines = new cv.Mat();
            // 弛みによる細切れに対応するため、maxLineGapを100に拡張
            cv.HoughLinesP(mask, lines, 1, Math.PI / 180, 40, 50, 100);

            // 4. 【2枚目の核心】角度による分類とクラスタリング
            let blueGroups = [];   // 右肩上がりグループ
            let orangeGroups = []; // 右肩下がりグループ

            const ANGLE_THRESHOLD = 6;     // 同じ線とみなす傾きの許容差（度）
            const INTERCEPT_THRESHOLD = 60; // ユーザー様が見つけてくださった最適な距離閾値
            let midY = Math.round(src.rows / 2); // 画面中央のY座標

            for (let i = 0; i < lines.rows; ++i) {
                let x1 = lines.data32S[i * 4];
                let y1 = lines.data32S[i * 4 + 1];
                let x2 = lines.data32S[i * 4 + 2];
                let y2 = lines.data32S[i * 4 + 3];

                // 角度（-90〜90度）を計算
                let angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
                if (angle > 90) angle -= 180;
                if (angle < -90) angle += 180;

                // 網の想定角度（斜め50〜85度）から外れる明らかなエラーノイズは除外
                if (Math.abs(angle) < 50 || Math.abs(angle) > 85) continue;

                let a = (x2 - x1) !== 0 ? (y2 - y1) / (x2 - x1) : 9999;
                let b = y1 - a * x1;
                let centerX = (midY - b) / a; // 画面中央を横切るX座標

                // 2枚目の通り、まずは「傾きの正負（角度）」で完全に2つの世界に分類
                let targetGroups = (a < 0) ? blueGroups : orangeGroups;

                // 分類された世界の中で、位置（centerX）が近いものをクラスタリング（マージ）
                let matched = false;
                for (let group of targetGroups) {
                    if (Math.abs(group.centerX - centerX) < INTERCEPT_THRESHOLD && Math.abs(group.angle - angle) < ANGLE_THRESHOLD) {
                        group.lines.push({a, b, centerX, angle});
                        matched = true;
                        break;
                    }
                }

                if (!matched) {
                    targetGroups.push({
                        centerX: centerX,
                        angle: angle,
                        lines: [{a, b, centerX, angle}]
                    });
                }
            }

            // 5. グループ化された直線を1本ずつ平均化して描画
            function drawClassifiedLines(groups, isOrange) {
                groups.forEach(group => {
                    // グループ内の全直線の純粋な平均値を算出
                    let sumA = 0, sumB = 0;
                    group.lines.forEach(l => {
                        sumA += l.a;
                        sumB += l.b;
                    });
                    let avgA = sumA / group.lines.length;
                    let avgB = sumB / group.lines.length;

                    // 画像の上端から下端までブチ抜く線を計算
                    let startY = 0;
                    let startX = Math.round((startY - avgB) / avgA);
                    let endY = dst.rows;
                    let endX = Math.round((endY - avgB) / avgA);

                    // 2枚目の通りの綺麗なセパレート色
                    let color = isOrange ? new cv.Scalar(255, 140, 0, 255) : new cv.Scalar(0, 100, 255, 255);
                    cv.line(dst, new cv.Point(startX, startY), new cv.Point(endX, endY), color, 3);
                });
            }

            // それぞれの角度グループを描画
            drawClassifiedLines(blueGroups, false);
            drawClassifiedLines(orangeGroups, true);

            // 結果を表示
            cv.imshow('canvasOutput', dst);

            // メモリ解放
            src.delete(); hsv.delete(); mask.delete(); dst.delete();
            lines.delete(); kernel.delete(); lowGreen.delete(); highGreen.delete();
        }
    </script>
</body>
</html>
