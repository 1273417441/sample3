<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>STEP1 ワイヤ抽出</title>

<style>
body{
    background:#111;
    color:white;
    font-family:sans-serif;
    margin:20px;
}

canvas{
    border:1px solid #444;
    max-width:100%;
}

.row{
    margin:8px 0;
}

label{
    display:inline-block;
    width:120px;
}

.value{
    display:inline-block;
    width:50px;
    color:#0f0;
}

.controls{
    margin-top:20px;
    background:#222;
    padding:10px;
}

.wrap{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}
</style>
</head>
<body>

<h2>STEP1 背景除去 → ワイヤ二値化</h2>

<input type="file" id="fileInput">

<div class="wrap">

<div>
    <h3>元画像</h3>
    <canvas id="srcCanvas"></canvas>
</div>

<div>
    <h3>二値化結果</h3>
    <canvas id="dstCanvas"></canvas>
</div>

</div>

<div class="controls">

<div class="row">
<label>Hue Min</label>
<input type="range" id="hMin" min="0" max="360" value="80">
<span class="value" id="hMinVal">80</span>
</div>

<div class="row">
<label>Hue Max</label>
<input type="range" id="hMax" min="0" max="360" value="180">
<span class="value" id="hMaxVal">180</span>
</div>

<div class="row">
<label>Sat Min</label>
<input type="range" id="sMin" min="0" max="100" value="20">
<span class="value" id="sMinVal">20</span>
</div>

<div class="row">
<label>Val Min</label>
<input type="range" id="vMin" min="0" max="100" value="15">
<span class="value" id="vMinVal">15</span>
</div>

</div>

<script>

const srcCanvas=document.getElementById("srcCanvas");
const dstCanvas=document.getElementById("dstCanvas");

const srcCtx=srcCanvas.getContext("2d");
const dstCtx=dstCanvas.getContext("2d");

let currentImage=null;

const controls=[
"hMin",
"hMax",
"sMin",
"vMin"
];

controls.forEach(id=>{
    const slider=document.getElementById(id);
    const label=document.getElementById(id+"Val");

    slider.addEventListener("input",()=>{
        label.textContent=slider.value;

        if(currentImage){
            processImage();
        }
    });
});

document.getElementById("fileInput").addEventListener("change",e=>{

    const file=e.target.files[0];
    if(!file) return;

    const img=new Image();

    img.onload=()=>{

        currentImage=img;

        srcCanvas.width=img.width;
        srcCanvas.height=img.height;

        dstCanvas.width=img.width;
        dstCanvas.height=img.height;

        srcCtx.drawImage(img,0,0);

        processImage();
    };

    img.src=URL.createObjectURL(file);
});

function processImage(){

    srcCtx.drawImage(currentImage,0,0);

    const imageData=srcCtx.getImageData(
        0,
        0,
        srcCanvas.width,
        srcCanvas.height
    );

    const data=imageData.data;

    const hMin=Number(document.getElementById("hMin").value);
    const hMax=Number(document.getElementById("hMax").value);
    const sMin=Number(document.getElementById("sMin").value);
    const vMin=Number(document.getElementById("vMin").value);

    const out=dstCtx.createImageData(
        srcCanvas.width,
        srcCanvas.height
    );

    const o=out.data;

    for(let i=0;i<data.length;i+=4){

        const r=data[i]/255;
        const g=data[i+1]/255;
        const b=data[i+2]/255;

        const hsv=rgbToHsv(r,g,b);

        const h=hsv.h;
        const s=hsv.s*100;
        const v=hsv.v*100;

        const isBackground=
            h>=hMin &&
            h<=hMax &&
            s>=sMin &&
            v>=vMin;

        const color=isBackground ? 0 : 255;

        o[i]=color;
        o[i+1]=color;
        o[i+2]=color;
        o[i+3]=255;
    }

    dstCtx.putImageData(out,0,0);
}

function rgbToHsv(r,g,b){

    const max=Math.max(r,g,b);
    const min=Math.min(r,g,b);

    const d=max-min;

    let h=0;

    if(d!==0){

        if(max===r){
            h=((g-b)/d)%6;
        }
        else if(max===g){
            h=(b-r)/d+2;
        }
        else{
            h=(r-g)/d+4;
        }

        h*=60;

        if(h<0){
            h+=360;
        }
    }

    const s=max===0 ? 0 : d/max;
    const v=max;

    return {h,s,v};
}

</script>

</body>
</html>
