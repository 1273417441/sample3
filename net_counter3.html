<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>STEP2 Skeleton Preparation</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>

body{
    background:#111;
    color:white;
    font-family:sans-serif;
    margin:20px;
}

h2{
    margin-bottom:10px;
}

.wrap{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.panel{
    display:flex;
    flex-direction:column;
}

canvas{
    border:1px solid #444;
    max-width:600px;
}

.controls{
    margin-top:20px;
    background:#222;
    padding:15px;
}

.row{
    margin-bottom:10px;
}

label{
    display:inline-block;
    width:160px;
}

.value{
    display:inline-block;
    width:50px;
    color:#00ff66;
}

.status{
    margin-top:10px;
    color:#ffcc00;
}

</style>
</head>
<body>

<h2>STEP2 モルフォロジー + Skeleton準備</h2>

<input type="file" id="fileInput">

<div class="status" id="status">
OpenCVロード待機中...
</div>

<div class="wrap">

<div class="panel">
<h3>元画像</h3>
<canvas id="srcCanvas"></canvas>
</div>

<div class="panel">
<h3>二値化</h3>
<canvas id="binaryCanvas"></canvas>
</div>

<div class="panel">
<h3>モルフォロジー後</h3>
<canvas id="morphCanvas"></canvas>
</div>

<div class="panel">
<h3>Skeleton</h3>
<canvas id="skeletonCanvas"></canvas>
</div>

</div>

<div class="controls">

<h3>HSV</h3>

<div class="row">
<label>Hue Min</label>
<input type="range" id="hMin" min="0" max="360" value="80">
<span class="value" id="hMinVal">80</span>
</div>

<div class="row">
<label>Hue Max</label>
<input type="range" id="hMax" min="0" max="360" value="180">
<span class="value" id="hMaxVal">180</span>
</div>

<div class="row">
<label>Sat Min</label>
<input type="range" id="sMin" min="0" max="100" value="20">
<span class="value" id="sMinVal">20</span>
</div>

<div class="row">
<label>Val Min</label>
<input type="range" id="vMin" min="0" max="100" value="15">
<span class="value" id="vMinVal">15</span>
</div>

<hr>

<h3>Morphology</h3>

<div class="row">
<label>Kernel Size</label>
<input type="range" id="kernelSize" min="1" max="15" value="3">
<span class="value" id="kernelSizeVal">3</span>
</div>

<div class="row">
<label>Iterations</label>
<input type="range" id="iterations" min="1" max="10" value="1">
<span class="value" id="iterationsVal">1</span>
</div>

</div>

<script>

let currentImage = null;
let cvReady = false;

const srcCanvas = document.getElementById("srcCanvas");
const binaryCanvas = document.getElementById("binaryCanvas");
const morphCanvas = document.getElementById("morphCanvas");
const skeletonCanvas = document.getElementById("skeletonCanvas");

const statusEl = document.getElementById("status");

const sliders = [
"hMin",
"hMax",
"sMin",
"vMin",
"kernelSize",
"iterations"
];

sliders.forEach(id=>{

    const s = document.getElementById(id);
    const v = document.getElementById(id+"Val");

    v.textContent = s.value;

    s.addEventListener("input",()=>{

        v.textContent = s.value;

        if(currentImage && cvReady){
            processImage();
        }

    });

});

document.getElementById("fileInput").addEventListener("change",e=>{

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = ()=>{

        currentImage = img;

        setupCanvasSize(img);

        processImage();

    };

    img.src = URL.createObjectURL(file);

});

function setupCanvasSize(img){

    const list = [
        srcCanvas,
        binaryCanvas,
        morphCanvas,
        skeletonCanvas
    ];

    list.forEach(c=>{

        c.width = img.width;
        c.height = img.height;

    });

}

function waitForOpenCV(){

    if(typeof cv === "undefined"){

        setTimeout(waitForOpenCV,100);
        return;

    }

    cvReady = true;

    statusEl.textContent =
        "OpenCVロード完了";

}

waitForOpenCV();

function processImage(){

    if(!currentImage) return;

    drawSource();

    createBinaryImage();

    createMorphImage();

    createSkeletonImage();

}

function drawSource(){

    const ctx =
        srcCanvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        srcCanvas.width,
        srcCanvas.height
    );

    ctx.drawImage(
        currentImage,
        0,
        0
    );

}

}

function createSkeletonImage(){

}

</script>

</body>
</html>
