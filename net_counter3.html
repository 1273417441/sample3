<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>STEP2 Skeleton Preparation</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>

body{
    background:#111;
    color:white;
    font-family:sans-serif;
    margin:20px;
}

h2{
    margin-bottom:10px;
}

.wrap{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.panel{
    display:flex;
    flex-direction:column;
}

canvas{
    border:1px solid #444;
    max-width:600px;
}

.controls{
    margin-top:20px;
    background:#222;
    padding:15px;
}

.row{
    margin-bottom:10px;
}

label{
    display:inline-block;
    width:160px;
}

.value{
    display:inline-block;
    width:50px;
    color:#00ff66;
}

.status{
    margin-top:10px;
    color:#ffcc00;
}

</style>
</head>
<body>

<h2>STEP2 モルフォロジー + Skeleton準備</h2>

<input type="file" id="fileInput">

<div class="status" id="status">
OpenCVロード待機中...
</div>

<div class="wrap">

<div class="panel">
<h3>元画像</h3>
<canvas id="srcCanvas"></canvas>
</div>

<div class="panel">
<h3>二値化</h3>
<canvas id="binaryCanvas"></canvas>
</div>

<div class="panel">
<h3>モルフォロジー後</h3>
<canvas id="morphCanvas"></canvas>
</div>

<div class="panel">
<h3>Skeleton</h3>
<canvas id="skeletonCanvas"></canvas>
</div>

</div>

<div class="controls">

<h3>HSV</h3>

<div class="row">
<label>Hue Min</label>
<input type="range" id="hMin" min="0" max="360" value="80">
<span class="value" id="hMinVal">80</span>
</div>

<div class="row">
<label>Hue Max</label>
<input type="range" id="hMax" min="0" max="360" value="180">
<span class="value" id="hMaxVal">180</span>
</div>

<div class="row">
<label>Sat Min</label>
<input type="range" id="sMin" min="0" max="100" value="20">
<span class="value" id="sMinVal">20</span>
</div>

<div class="row">
<label>Val Min</label>
<input type="range" id="vMin" min="0" max="100" value="15">
<span class="value" id="vMinVal">15</span>
</div>

<hr>

<h3>Morphology</h3>

<div class="row">
<label>Kernel Size</label>
<input type="range" id="kernelSize" min="1" max="15" value="3">
<span class="value" id="kernelSizeVal">3</span>
</div>

<div class="row">
<label>Iterations</label>
<input type="range" id="iterations" min="1" max="10" value="1">
<span class="value" id="iterationsVal">1</span>
</div>

</div>

<script>

let currentImage = null;
let cvReady = false;

const srcCanvas = document.getElementById("srcCanvas");
const binaryCanvas = document.getElementById("binaryCanvas");
const morphCanvas = document.getElementById("morphCanvas");
const skeletonCanvas = document.getElementById("skeletonCanvas");

const statusEl = document.getElementById("status");

const sliders = [
"hMin",
"hMax",
"sMin",
"vMin",
"kernelSize",
"iterations"
];

sliders.forEach(id=>{

    const s = document.getElementById(id);
    const v = document.getElementById(id+"Val");

    v.textContent = s.value;

    s.addEventListener("input",()=>{

        v.textContent = s.value;

        if(currentImage && cvReady){
            processImage();
        }

    });

});

document.getElementById("fileInput").addEventListener("change",e=>{

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = ()=>{

        currentImage = img;

        setupCanvasSize(img);

        processImage();

    };

    img.src = URL.createObjectURL(file);

});

function setupCanvasSize(img){

    const list = [
        srcCanvas,
        binaryCanvas,
        morphCanvas,
        skeletonCanvas
    ];

    list.forEach(c=>{

        c.width = img.width;
        c.height = img.height;

    });

}

function waitForOpenCV(){

    if(typeof cv === "undefined"){

        setTimeout(waitForOpenCV,100);
        return;

    }

    cvReady = true;

    statusEl.textContent =
        "OpenCVロード完了";

}

waitForOpenCV();

function processImage(){

    if(!currentImage) return;

    drawSource();

    const binaryMat = createBinaryImage();

    const morphMat = createMorphImage(binaryMat);

    createSkeletonImage(morphMat);

}

function drawSource(){

    const ctx =
        srcCanvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        srcCanvas.width,
        srcCanvas.height
    );

    ctx.drawImage(
        currentImage,
        0,
        0
    );

}

function createBinaryImage(){

    const srcCanvas =
        document.getElementById("srcCanvas");

    let src =
        cv.imread(srcCanvas);

    let hsv =
        new cv.Mat();

    cv.cvtColor(
        src,
        hsv,
        cv.COLOR_RGBA2RGB
    );

    cv.cvtColor(
        hsv,
        hsv,
        cv.COLOR_RGB2HSV
    );

    const hMin =
        parseInt(document.getElementById("hMin").value);

    const hMax =
        parseInt(document.getElementById("hMax").value);

    const sMin =
        parseInt(document.getElementById("sMin").value);

    const vMin =
        parseInt(document.getElementById("vMin").value);

    let lower =
        new cv.Mat(
            hsv.rows,
            hsv.cols,
            hsv.type(),
            [
                hMin/2,
                sMin*2.55,
                vMin*2.55,
                0
            ]
        );

    let upper =
        new cv.Mat(
            hsv.rows,
            hsv.cols,
            hsv.type(),
            [
                hMax/2,
                255,
                255,
                255
            ]
        );

    let bgMask =
        new cv.Mat();

    cv.inRange(
        hsv,
        lower,
        upper,
        bgMask
    );

    let wireMask =
        new cv.Mat();

    cv.bitwise_not(
        bgMask,
        wireMask
    );

    cv.imshow(
        "binaryCanvas",
        wireMask
    );

    src.delete();
    hsv.delete();
    lower.delete();
    upper.delete();
    bgMask.delete();

    return wireMask;
}

function createMorphImage(binaryMat){

    const kernelSize =
        parseInt(
            document.getElementById("kernelSize").value
        );

    const iterations =
        parseInt(
            document.getElementById("iterations").value
        );

    let morph =
        binaryMat.clone();

    let kernel =
        cv.getStructuringElement(
            cv.MORPH_RECT,
            new cv.Size(
                kernelSize,
                kernelSize
            )
        );

    //
    // OPEN
    //

    cv.morphologyEx(
        morph,
        morph,
        cv.MORPH_OPEN,
        kernel,
        new cv.Point(-1,-1),
        iterations
    );

    //
    // CLOSE
    //

    cv.morphologyEx(
        morph,
        morph,
        cv.MORPH_CLOSE,
        kernel,
        new cv.Point(-1,-1),
        iterations
    );

    cv.imshow(
        "morphCanvas",
        morph
    );

    kernel.delete();

    binaryMat.delete();

    return morph;
}

function createSkeletonImage(morphMat){

    const skeletonMat =
        zhangSuenThinning(morphMat);

    cv.imshow(
        "skeletonCanvas",
        skeletonMat
    );

    morphMat.delete();
    skeletonMat.delete();
}

function zhangSuenThinning(src){

    let img = src.clone();

    const rows = img.rows;
    const cols = img.cols;

    let changed;

    do{

        changed = false;

        changed |= thinningIteration(
            img,
            rows,
            cols,
            0
        );

        changed |= thinningIteration(
            img,
            rows,
            cols,
            1
        );

    }while(changed);

    return img;
}

function thinningIteration(
    img,
    rows,
    cols,
    iter
){

    const marker =
        new Uint8Array(rows * cols);

    let changed = false;

    const data = img.data;

    for(let y=1;y<rows-1;y++){

        for(let x=1;x<cols-1;x++){

            const p1 = y*cols+x;

            if(data[p1]===0)
                continue;

            const p2=data[(y-1)*cols+x];
            const p3=data[(y-1)*cols+x+1];
            const p4=data[y*cols+x+1];
            const p5=data[(y+1)*cols+x+1];
            const p6=data[(y+1)*cols+x];
            const p7=data[(y+1)*cols+x-1];
            const p8=data[y*cols+x-1];
            const p9=data[(y-1)*cols+x-1];

            const b =
                (p2>0)+(p3>0)+(p4>0)+
                (p5>0)+(p6>0)+(p7>0)+
                (p8>0)+(p9>0);

            if(b<2 || b>6)
                continue;

            const a =
                (p2===0&&p3>0)+
                (p3===0&&p4>0)+
                (p4===0&&p5>0)+
                (p5===0&&p6>0)+
                (p6===0&&p7>0)+
                (p7===0&&p8>0)+
                (p8===0&&p9>0)+
                (p9===0&&p2>0);

            if(a!==1)
                continue;

            if(iter===0){

                if(
                    (p2>0 && p4>0 && p6>0) ||
                    (p4>0 && p6>0 && p8>0)
                ){
                    continue;
                }

            }else{

                if(
                    (p2>0 && p4>0 && p8>0) ||
                    (p2>0 && p6>0 && p8>0)
                ){
                    continue;
                }
            }

            marker[p1]=1;
        }
    }

    for(let i=0;i<marker.length;i++){

        if(marker[i]){

            data[i]=0;
            changed=true;
        }
    }

    return changed;
}

</script>

</body>
</html>
