<script>

let currentImage = null;
let cvReady = false;

const srcCanvas = document.getElementById("srcCanvas");
const binaryCanvas = document.getElementById("binaryCanvas");
const morphCanvas = document.getElementById("morphCanvas");
const skeletonCanvas = document.getElementById("skeletonCanvas");
const gridCanvas = document.getElementById("gridCanvas"); // 📍 追加

const statusEl = document.getElementById("status");

const sliders = [
"hMin",
"hMax",
"sMin",
"vMin",
"kernelSize",
"iterations"
];

sliders.forEach(id=>{

    const s = document.getElementById(id);
    const v = document.getElementById(id+"Val");

    v.textContent = s.value;

    s.addEventListener("input",()=>{

        v.textContent = s.value;

        if(currentImage && cvReady){
            processImage();
        }

    });

});

document.getElementById("fileInput").addEventListener("change",e=>{

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = ()=>{

        currentImage = img;

        setupCanvasSize(img);

        processImage();

    };

    img.src = URL.createObjectURL(file);

});

// 📍 【最重要修正】gridCanvasの内部サイズも元画像と完全に一致させる
function setupCanvasSize(img){

    const list = [
        srcCanvas,
        binaryCanvas,
        morphCanvas,
        skeletonCanvas,
        gridCanvas // 👈 ここに gridCanvas を追加し忘れていたのが原因でした！
    ];

    list.forEach(c=>{

        c.width = img.width;
        c.height = img.height;

    });

}

function waitForOpenCV(){

    if(typeof cv === "undefined"){

        setTimeout(waitForOpenCV,100);
        return;

    }

    cvReady = true;

    statusEl.textContent =
        "OpenCVロード完了";

}

waitForOpenCV();

function processImage(){

    if(!currentImage) return;

    drawSource();

    const binaryMat = createBinaryImage();

    const morphMat = createMorphImage(binaryMat);

    const skeletonMat = createSkeletonImage(morphMat);

    cv.rectangle(
        skeletonMat,
        new cv.Point(0, 0),
        new cv.Point(skeletonMat.cols, skeletonMat.rows),
        new cv.Scalar(0),
        30 
    );

    detectAngles(skeletonMat);

}

function drawSource(){

    const ctx =
        srcCanvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        srcCanvas.width,
        srcCanvas.height
    );

    ctx.drawImage(
        currentImage,
        0,
        0
    );

}

function createBinaryImage(){

    const srcCanvas =
        document.getElementById("srcCanvas");

    let src =
        cv.imread(srcCanvas);

    let hsv =
        new cv.Mat();

    cv.cvtColor(
        src,
        hsv,
        cv.COLOR_RGBA2RGB
    );

    cv.cvtColor(
        hsv,
        hsv,
        cv.COLOR_RGB2HSV
    );

    const hMin =
        parseInt(document.getElementById("hMin").value);

    const hMax =
        parseInt(document.getElementById("hMax").value);

    const sMin =
        parseInt(document.getElementById("sMin").value);

    const vMin =
        parseInt(document.getElementById("vMin").value);

    let lower =
        new cv.Mat(
            hsv.rows,
            hsv.cols,
            hsv.type(),
            [
                hMin/2,
                sMin*2.55,
                vMin*2.55,
                0
            ]
        );

    let upper =
        new cv.Mat(
            hsv.rows,
            hsv.cols,
            hsv.type(),
            [
                hMax/2,
                255,
                255,
                255
            ]
        );

    let bgMask =
        new cv.Mat();

    cv.inRange(
        hsv,
        lower,
        upper,
        bgMask
    );

    let wireMask =
        new cv.Mat();

    cv.bitwise_not(
        bgMask,
        wireMask
    );

    cv.imshow(
        "binaryCanvas",
        wireMask
    );

    src.delete();
    hsv.delete();
    lower.delete();
    upper.delete();
    bgMask.delete();

    return wireMask;
}

function createMorphImage(binaryMat){

    const kernelSize =
        parseInt(
            document.getElementById("kernelSize").value
        );

    const iterations =
        parseInt(
            document.getElementById("iterations").value
        );

    let morph =
        binaryMat.clone();

    let kernel =
        cv.getStructuringElement(
            cv.MORPH_RECT,
            new cv.Size(
                kernelSize,
                kernelSize
            )
        );

    cv.morphologyEx(
        morph,
        morph,
        cv.MORPH_OPEN,
        kernel,
        new cv.Point(-1,-1),
        iterations
    );

    cv.morphologyEx(
        morph,
        morph,
        cv.MORPH_CLOSE,
        kernel,
        new cv.Point(-1,-1),
        iterations
    );
    
    cv.imshow(
        "morphCanvas",
        morph
    );

    kernel.delete();

    binaryMat.delete();

    return morph;
}

function createSkeletonImage(morphMat){

    const skeletonMat =
        zhangSuenThinning(morphMat);
    
    cv.imshow(
        "skeletonCanvas",
        skeletonMat
    );

    morphMat.delete();
    return skeletonMat;
}

function zhangSuenThinning(src){

    let img = src.clone();

    const rows = img.rows;
    const cols = img.cols;

    let changed;

    do{

        changed = false;

        changed |= thinningIteration(
            img,
            rows,
            cols,
            0
        );

        changed |= thinningIteration(
            img,
            rows,
            cols,
            1
        );

    }while(changed);

    return img;
}

function thinningIteration(
    img,
    rows,
    cols,
    iter
){

    const marker =
        new Uint8Array(rows * cols);

    let changed = false;

    const data = img.data;

    for(let y=1;y<rows-1;y++){

        for(let x=1;x<cols-1;x++){

            const p1 = y*cols+x;

            if(data[p1]===0)
                continue;

            const p2=data[(y-1)*cols+x];
            const p3=data[(y-1)*cols+x+1];
            const p4=data[y*cols+x+1];
            const p5=data[(y+1)*cols+x+1];
            const p6=data[(y+1)*cols+x];
            const p7=data[(y+1)*cols+x-1];
            const p8=data[y*cols+x-1];
            const p9=data[(y-1)*cols+x-1];

            const b =
                (p2>0)+(p3>0)+(p4>0)+
                (p5>0)+(p6>0)+(p7>0)+
                (p8>0)+(p9>0);

            if(b<2 || b>6)
                continue;

            const a =
                (p2===0&&p3>0)+
                (p3===0&&p4>0)+
                (p4===0&&p5>0)+
                (p5===0&&p6>0)+
                (p6===0&&p7>0)+
                (p7===0&&p8>0)+
                (p8===0&&p9>0)+
                (p9===0&&p2>0);

            if(a!==1)
                continue;

            if(iter===0){

                if(
                    (p2>0 && p4>0 && p6>0) ||
                    (p4>0 && p6>0 && p8>0)
                ){
                    continue;
                }

            }else{

                if(
                    (p2>0 && p4>0 && p8>0) ||
                    (p2>0 && p6>0 && p8>0)
                ){
                    continue;
                }
            }

            marker[p1]=1;
        }
    }

    for(let i=0;i<marker.length;i++){

        if(marker[i]){

            data[i]=0;
            changed=true;
        }
    }

    return changed;
}

// 📍 司令塔関数
function detectAngles(skeletonMat){

    const hist = buildAngleHistogram(skeletonMat);
    const candidates = findAngleCandidates(hist);

    // 💡 これで best[0].peaks と best[1].peaks にデータが保持されます
    const best = evaluateAngles(skeletonMat, candidates);

    document.getElementById("thetaA").textContent = best[0].theta;
    document.getElementById("thetaB").textContent = best[1].theta;
    document.getElementById("pitchA").textContent = best[0].pitch;
    document.getElementById("pitchB").textContent = best[1].pitch;

    // 💡 ChatGPTが言っている「const peaksA = [...]」の状態を作ります
    if (best[0].theta !== "--" && best[0].pitch !== "--" && best[1].theta !== "--") {
        const peaksA = best[0].peaks; // ★ Part5のピーク検出結果を保持！
        const peaksB = best[1].peaks; // ★ Part5のピーク検出結果を保持！

        // 📍 【修正箇所1】画像の幅(w)と高さ(h)をしっかり定義してあげる
        const w = skeletonMat.cols;
        const h = skeletonMat.rows;

        // 📍 【修正箇所2】pitchA / pitchB ではなく、正しい変数名 best[0].pitch / best[1].pitch から渡す
        const rhoStartA = estimateRhoStart(peaksA, best[0].pitch);
        const rhoStartB = estimateRhoStart(peaksB, best[1].pitch);

        // 現在はまだ機械的に引いている段階（Part6のまま維持）
        const idealA = buildIdealLines(
            best[0].theta,
            best[0].pitch,
            rhoStartA,
            w,
            h
        );

        const idealB = buildIdealLines(
            best[1].theta,
            best[1].pitch,
            rhoStartB,
            w,
            h
        );

        const crossPoints = buildCrossPoints(idealA, idealB);

        const scoredPoints = scoreGridPoints(crossPoints, skeletonMat);

        // ⭕️ 修正後のコード
        const { survived, rejected, survivedMap } = snapGridPoints(scoredPoints, skeletonMat);

        // ========================================================
        // 🎯 Part9: 3色デバッグ描画（黄・オレンジ・赤）
        // ========================================================
        const canvas = document.getElementById("gridCanvas");
        const ctx = canvas.getContext("2d");
        const src = document.getElementById("srcCanvas");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(src, 0, 0);

        // 欠損補完点の計算
        const recoveredPoints = reconstructMissingPoints(crossPoints, survived);

        // ========================================================
        // 🎯 Part10: 交点（黄色）のみを残し、結び目中心へ最終吸着！
        // ========================================================
        
        for (const p of crossPoints) {
            // 1. まずはMLSで滑らかな「理想のしなり座標」を計算
            const warp = gridWarpMLS(p.i, p.j, survived);
            const idealX = p.x + warp.dx;
            const idealY = p.y + warp.dy;

            // 🌟 【ここが足りていませんでした】
            // 直接、理想のX座標（idealX）とY座標（idealY）をバラバラの数字のまま関数に渡しました
            const snapped = snapPointToSkeleton(idealX, idealY, skeletonMat, 15);

            // 3. 線から「結び目のど真ん中（重心）」へさらに吸着
            const center = knotCenter(
                snapped.x,
                snapped.y,
                skeletonMat
            );

            // 🟡 最終決定した結び目中心（center）の座標を、目標PNGと同じ鮮やかな黄色で描画
            ctx.fillStyle = "#F5C400";
            ctx.beginPath();
            ctx.arc(
                center.x,
                center.y,
                4, // ドットの大きさ
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

    } // ➔ if (bestGrid.score > 0) の終わり

function buildAngleHistogram(mat){

    const hist = new Array(180).fill(0);

    const w = mat.cols;
    const h = mat.rows;
    const d = mat.data;

    const border = 10;

    const points = [];

    for(let y=border;y<h-border;y++){

        for(let x=border;x<w-border;x++){

            if(d[y*w+x]>0){

                points.push({x,y});
            }
        }
    }

    const maxDist = 12;

    for(let i=0;i<points.length;i++){

        const p1 = points[i];

        for(let j=i+1;j<points.length;j++){

            const p2 = points[j];

            const dx = p2.x-p1.x;
            const dy = p2.y-p1.y;

            const dist2 =
                dx*dx+dy*dy;

            if(
                dist2<4 ||
                dist2>maxDist*maxDist
            ){
                continue;
            }

            let ang =
                Math.atan2(dy,dx)*
                180/Math.PI;

            ang =
                Math.round(
                    (ang+180)%180
                );

            hist[ang]++;
        }
    }

    return smoothHistogram(
        hist,
        5
    );
}

function smoothHistogram(
    hist,
    radius
){

    const out =
        new Array(hist.length).fill(0);

    for(let i=0;i<hist.length;i++){

        let sum=0;
        let cnt=0;

        for(
            let k=-radius;
            k<=radius;
            k++
        ){

            const idx =
                (i+k+180)%180;

            sum += hist[idx];
            cnt++;
        }

        out[i]=sum/cnt;
    }

    return out;
}

function evaluateAngles(skeletonMat, candidates) {
    let bestPair = null;
    let maxScore = -1;

    for (let i = 0; i < candidates.length; i++) {
        for (let j = i + 1; j < candidates.length; j++) {
            const theta1 = candidates[i];
            const theta2 = candidates[j];

            let diffAngle = Math.abs(theta1 - theta2);
            diffAngle = Math.min(diffAngle, 180 - diffAngle);
            if (diffAngle < 40) continue; 

            const hist1 = buildRhoHistogram(skeletonMat, theta1);
            const hist2 = buildRhoHistogram(skeletonMat, theta2);

            const peaks1 = findRhoPeaks(hist1, 20); 
            const peaks2 = findRhoPeaks(hist2, 20);

            const pitch1 = estimatePitch(peaks1);
            const pitch2 = estimatePitch(peaks2);

            if (pitch1 < 20 || pitch1 > 80 || pitch2 < 20 || pitch2 > 80) continue;

            const score = peaks1.length + peaks2.length;

            if (score > maxScore) {
                maxScore = score;
                // 💡 ChatGPTの指示通り、検出された「生のpeaks（ピーク配列）」をしっかり保持してセットする
                bestPair = [
                    { theta: theta1, pitch: pitch1, peaks: peaks1 }, 
                    { theta: theta2, pitch: pitch2, peaks: peaks2 }
                ];
            }
        }
    }

    if (!bestPair) {
        return [
            { theta: "--", pitch: "--", peaks: [] },
            { theta: "--", pitch: "--", peaks: [] }
        ];
    }

    bestPair.sort((a, b) => a.theta - b.theta);
    return bestPair;
}

function findRhoPeaks(hist, minSpacing) {
    const peaks = [];
    
    for (let r = 2; r < hist.length - 2; r++) {
        if (hist[r] > hist[r-1] && hist[r] > hist[r-2] &&
            hist[r] > hist[r+1] && hist[r] > hist[r+2] && hist[r] > 10) {
            
            let tooClose = false;
            for (const p of peaks) {
                if (Math.abs(r - p) < minSpacing) {
                    tooClose = true;
                    break;
                }
            }
            if (!tooClose) {
                peaks.push(r);
            }
        }
    }
    return peaks;
}
    
function findAngleCandidates(hist){

    const peaks=[];

    const tmp=
        hist.map(
            (v,i)=>({a:i,v})
        );

    tmp.sort(
        (a,b)=>b.v-a.v
    );

    for(const p of tmp){

        let ok=true;

        for(const q of peaks){

            let d=
                Math.abs(
                    p.a-q
                );

            d=
                Math.min(
                    d,
                    180-d
                );

            if(d<20){

                ok=false;
                break;
            }
        }

        if(ok){

            peaks.push(p.a);
        }

        if(peaks.length===8)
            break;
    }

    return peaks;
}

function buildRhoHistogram(
    mat,
    thetaDeg
){

    const w=mat.cols;
    const h=mat.rows;

    const d=mat.data;

    const theta=
        thetaDeg*
        Math.PI/180;

    const ct=
        Math.cos(theta);

    const st=
        Math.sin(theta);

    const rhoMax=
        Math.ceil(
            Math.sqrt(
                w*w+h*h
            )
        );

    const hist=
        new Array(
            rhoMax*2+1
        ).fill(0);

    for(let y=0;y<h;y++){

        for(let x=0;x<w;x++){

            if(
                d[y*w+x]===0
            ) continue;

            const rho=
                Math.round(
                    x*ct+y*st
                );

            hist[
                rho+rhoMax
            ]++;
        }
    }

    return hist;
}

function estimatePitch(rhoList){

    if(rhoList.length < 4){
        return 0;
    }

    rhoList.sort((a,b)=>a-b);

    const diffs = [];

    for(let i=1;i<rhoList.length;i++){

        const d = rhoList[i]-rhoList[i-1];

        if(d < 20) continue;
        if(d > 80) continue;

        diffs.push(d);
    }

    if(diffs.length===0){
        return 0;
    }

    diffs.sort((a,b)=>a-b);

    return diffs[Math.floor(diffs.length/2)];
}
    
function buildIdealLines(
    thetaDeg,
    pitch,
    rhoStart,
    width,
    height
){

    const theta =
        thetaDeg*Math.PI/180;

    const diag =
        Math.sqrt(
            width*width+
            height*height
        );

    const lines=[];

    let rho=rhoStart;

    while(rho> -diag)
        rho-=pitch;

    for(
        ;
        rho<=diag;
        rho+=pitch
    ){

        lines.push({
            theta,
            rho
        });

    }

    return lines;
}

function buildCrossPoints(linesA, linesB){

    const pts = [];

    // ⭕️ linesA のループにカウンター「i」を導入
    for (let i = 0; i < linesA.length; i++) {
        const a = linesA[i];
        
        const ca = Math.cos(a.theta);
        const sa = Math.sin(a.theta);

        // ⭕️ linesB のループにカウンター「j」を導入
        for (let j = 0; j < linesB.length; j++) {
            const b = linesB[j];
            
            const cb = Math.cos(b.theta);
            const sb = Math.sin(b.theta);

            const det = ca*sb - cb*sa;

            if(Math.abs(det)<1e-6) continue;

            const x = (a.rho*sb - b.rho*sa) / det;
            const y = (b.rho*ca - a.rho*cb) / det;

            // ⭕️ 座標と一緒に、格子インデックス（i, j）をセットして保存します！
            pts.push({
                x: x,
                y: y,
                i: i,
                j: j
            });
        }
    }
    return pts;
}

// 📍 【背景描画】元画像全体を背景として綺麗にコピーする
function drawGridPoints(canvas, pts){

    const ctx = canvas.getContext("2d");

    const src = document.getElementById("srcCanvas");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(src, 0, 0);

    ctx.fillStyle = "yellow";

    for(const p of pts){
        if(
            p.x < 0 ||
            p.y < 0 ||
            p.x >= canvas.width ||
            p.y >= canvas.height
        ){
            continue;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
    }
}

function estimateRhoStart(peaks, pitch){

    if(!peaks || peaks.length===0)
        return 0;

    const phaseHist = new Map();

    for(const rho of peaks){

        let phase = rho % pitch;

        if(phase < 0)
            phase += pitch;

        const key = Math.round(phase);

        phaseHist.set(
            key,
            (phaseHist.get(key)||0)+1
        );
    }

    let bestPhase = 0;
    let bestCount = 0;

    for(const [phase,count] of phaseHist){

        if(count > bestCount){

            bestCount = count;
            bestPhase = phase;
        }
    }

    return bestPhase;
}
    
function skeletonDensity(
    skeleton,
    cx,
    cy,
    radius
){

    let count = 0;

    const x0 =
        Math.max(
            0,
            Math.floor(cx-radius)
        );

    const x1 =
        Math.min(
            skeleton.cols-1,
            Math.ceil(cx+radius)
        );

    const y0 =
        Math.max(
            0,
            Math.floor(cy-radius)
        );

    const y1 =
        Math.min(
            skeleton.rows-1,
            Math.ceil(cy+radius)
        );

    for(let y=y0;y<=y1;y++){

        for(let x=x0;x<=x1;x++){

            const dx=x-cx;
            const dy=y-cy;

            if(
                dx*dx+dy*dy >
                radius*radius
            ){
                continue;
            }

            if(
                skeleton.ucharPtr(y,x)[0]
                >0
            ){
                count++;
            }
        }
    }

    return count;
}

function scoreGridPoints(
    points,
    skeleton
){

    const out=[];

    for(const p of points){

        const score =
            skeletonDensity(
                skeleton,
                p.x,
                p.y,
                8
            );

        // ⭕️ 修正：元の p に入っていたインデックス (i と j) を、ここで消さずにしっかり次へ引き継ぎます！
        out.push({
            x:p.x,
            y:p.y,
            i:p.i,
            j:p.j,
            score
        });
    }

    return out;
}

function snapPointToSkeleton(
    p,
    skeletonMat,
    searchRadius = 6
){

    let bestX = p.x;
    let bestY = p.y;
    let bestScore = -1;

    for(let dy=-searchRadius; dy<=searchRadius; dy++){

        for(let dx=-searchRadius; dx<=searchRadius; dx++){

            const x = Math.round(p.x + dx);
            const y = Math.round(p.y + dy);

            if(
                x < 0 ||
                y < 0 ||
                x >= skeletonMat.cols ||
                y >= skeletonMat.rows
            ){
                continue;
            }

            const score =
                skeletonDensity(
                    skeletonMat,
                    x,
                    y,
                    5
                );

            if(score > bestScore){

                bestScore = score;
                bestX = x;
                bestY = y;
            }
        }
    }

    return {
        x: bestX,
        y: bestY,
        dx: bestX - p.x, // 💡 追加：元の位置からX方向にどれだけ動いたか
        dy: bestY - p.y, // 💡 追加：元の位置からY方向にどれだけ動いたか
        score: bestScore
    };
}

function snapGridPoints(scoredPoints, skeletonMat) {
    const survived = [];
    const rejected = [];
    const survivedMap = {};

    for (const p of scoredPoints) {
        // 1️⃣ 先に全員、周囲6pxの吸着探索を実行する！
        const s = snapPointToSkeleton(p, skeletonMat, 6);
        
        // 2️⃣ 吸着した「後」のスコアで合格・不合格をジャッジ（基準は10）
        if (s.score < 10) {
            // 🔴 不合格：元の理想点座標とインデックスを赤点用に保存
            rejected.push({
                x: p.x,
                y: p.y,
                i: p.i,
                j: p.j
            });
        } else {
            // 🟡 合格：吸着後の座標(s.x, s.y)とインデックスを保存
            const pt = {
                i: p.i,
                j: p.j,
                x: s.x,
                y: s.y,
                dx: s.dx,
                dy: s.dy
            };

            survived.push(pt);
            survivedMap[`${p.i}_${p.j}`] = pt; // キーは ${i}_${j} の形に変更
        }
    }

    return {
        survived: survived,
        rejected: rejected,
        survivedMap: survivedMap
    };
}

function estimateGlobalWarp(snappedPoints){

    const dxs = [];
    const dys = [];

    for(const p of snappedPoints){

        dxs.push(p.dx);
        dys.push(p.dy);
    }

    dxs.sort((a,b)=>a-b);
    dys.sort((a,b)=>a-b);

    const mdx =
        dxs[Math.floor(dxs.length/2)];

    const mdy =
        dys[Math.floor(dys.length/2)];

    return {
        dx: mdx,
        dy: mdy
    };
}

function localWarp(
    x,
    y,
    snappedPoints,
    radius = 80
){

    let sx=0;
    let sy=0;
    let sw=0;

    for(const p of snappedPoints){

        const ddx =
            p.x - x;

        const ddy =
            p.y - y;

        const d2 =
            ddx*ddx + ddy*ddy;

        if(d2 > radius*radius)
            continue;

        const w =
            1/(d2+1);

        sx += p.dx*w;
        sy += p.dy*w;
        sw += w;
    }

    if(sw===0)
        return {dx:0,dy:0};

    return {
        dx:sx/sw,
        dy:sy/sw
    };
}

function buildGridMap(points){

    const map = new Map();

    for(const p of points){

        const key =
            p.i + "," + p.j;

        map.set(key,p);
    }

    return map;
}

function findMissingGridPoints(
    allGridPoints,
    survivedMap
){

    const missing = [];

    for(const p of allGridPoints){

        const key =
            p.i + "," + p.j;

        if(!survivedMap.has(key)){

            missing.push(p);
        }
    }

    return missing;
}

function estimateMissingPoint(
    p,
    survivedMap
){

    const L =
        survivedMap.get(
            (p.i-1)+","+p.j
        );

    const R =
        survivedMap.get(
            (p.i+1)+","+p.j
        );

    if(L && R){

        return {
            x:(L.x+R.x)/2,
            y:(L.y+R.y)/2,
            i:p.i,
            j:p.j,
            virtual:true
        };
    }

    const U =
        survivedMap.get(
            p.i+","+(p.j-1)
        );

    const D =
        survivedMap.get(
            p.i+","+(p.j+1)
        );

    if(U && D){

        return {
            x:(U.x+D.x)/2,
            y:(U.y+D.y)/2,
            i:p.i,
            j:p.j,
            virtual:true
        };
    }

    return null;
}

function reconstructMissingPoints(
    allGridPoints,
    survivedPoints
){

    const map =
        buildGridMap(
            survivedPoints
        );

    const missing =
        findMissingGridPoints(
            allGridPoints,
            map
        );

    const recovered = [];

    for(const p of missing){

        const r =
            estimateMissingPoint(
                p,
                map
            );

        if(r)
            recovered.push(r);
    }

    return recovered;
}

function gridWarpMLS(i, j, survivedPoints) {
    // 💡 遠くの点の「しなりトレンド」を一切減衰させずに外側まで届ける設定
    const alpha = 0.0; // ➔ 0にすることで、距離による影響力のシャットアウトを無くします

    let sumW = 0;
    let sumDx = 0;
    let sumDy = 0;

    for (const p of survivedPoints) {
        const di = p.i - i;
        const dj = p.j - j;
        const dist2 = di * di + dj * dj;

        // 💡 近くの点は少し強めに、でも遠くの点のトレンドも絶対に捨てないマイルドな重み
        const w = 1.0 / (Math.sqrt(dist2) + 1.0);

        sumW += w;
        sumDx += p.dx * w;
        sumDy += p.dy * w;
    }

    if (sumW === 0) {
        return { dx: 0, dy: 0 };
    }

    return {
        dx: sumDx / sumW,
        dy: sumDy / sumW
    };
}

function affineWarp(i, j, survivedMap){

    const neigh = [];

    for(const key in survivedMap){

        const p = survivedMap[key];

        const di = p.i - i;
        const dj = p.j - j;

        const dist2 = di*di + dj*dj;

        neigh.push({
            dist2,
            dx:p.dx,
            dy:p.dy
        });
    }

    neigh.sort((a,b)=>a.dist2-b.dist2);

    const K = Math.min(8, neigh.length);

    let sumW = 0;
    let sumDx = 0;
    let sumDy = 0;

    for(let k=0;k<K;k++){

        const n = neigh[k];

        const w = 1 / (Math.sqrt(n.dist2)+1);

        sumW += w;
        sumDx += n.dx * w;
        sumDy += n.dy * w;
    }

    if(sumW===0){
        return {dx:0,dy:0};
    }

    return {
        dx:sumDx/sumW,
        dy:sumDy/sumW
    };
}

function generateCellCenters(gridMap){

    const centers = [];

    const keys = Object.keys(gridMap);

    for(const key of keys){

        const [i,j] = key.split('_').map(Number);

        const p00 = gridMap[`${i}_${j}`];
        const p10 = gridMap[`${i+1}_${j}`];
        const p01 = gridMap[`${i}_${j+1}`];
        const p11 = gridMap[`${i+1}_${j+1}`];

        if(!p00 || !p10 || !p01 || !p11){
            continue;
        }

        centers.push({

            x:(p00.x+p10.x+p01.x+p11.x)/4,

            y:(p00.y+p10.y+p01.y+p11.y)/4
        });
    }

    return centers;
}

function knotCenter(x,y,skeletonMat)
{
    let sumX=0;
    let sumY=0;
    let count=0;

    const R=8;

    for(let dy=-R;dy<=R;dy++)
    {
        for(let dx=-R;dx<=R;dx++)
        {
            const px=Math.round(x+dx);
            const py=Math.round(y+dy);

            if(px<0||py<0||
               px>=skeletonMat.cols||
               py>=skeletonMat.rows)
               continue;

            if(skeletonMat.ucharPtr(py,px)[0]>0)
            {
                sumX+=px;
                sumY+=py;
                count++;
            }
        }
    }

    if(count===0)
    {
        return {x,y};
    }

    return{
        x:sumX/count,
        y:sumY/count
    };
}
