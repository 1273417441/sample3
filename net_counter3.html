<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>網の直線検出（本格クラスタリング版）</title>
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</head>
<body>
    <h2>網の直線検出プロトタイプ（弛み対策クラスタリング実装）</h2>
    <input type="file" id="fileInput" accept="image/*"><br><br>
    
    <div>
        <canvas id="canvasInput" style="max-width: 400px;"></canvas>
        <canvas id="canvasOutput" style="max-width: 400px;"></canvas>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', (e) => {
            let imgElement = document.getElementById('canvasInput');
            let ctx = imgElement.getContext('2d');
            let reader = new FileReader();
            
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    imgElement.width = img.width;
                    imgElement.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    if (typeof cv !== 'undefined' && cv.Mat) { 
                        processImageAdvanced(); 
                    } else {
                        alert("OpenCV.jsがまだ読み込み途中です。数秒待ってから画像を再選択してください。");
                    }
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        function processImageAdvanced() {
            let src = cv.imread('canvasInput');
            let hsv = new cv.Mat();
            let mask = new cv.Mat();
            let dst = src.clone();

            // 1. グリーンバック除去
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
            
            let lowGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [35, 35, 35, 0]);
            let highGreen = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [90, 255, 255, 255]);
            cv.inRange(hsv, lowGreen, highGreen, mask);
            cv.bitwise_not(mask, mask);

            // 2. 弛んだ網をできるだけ太く繋ぐモルフォロジー
            let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
            cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernel);

            // 3. ハフ変換（細切れになってもいいので、弛んだカーブを網羅的に拾う設定）
            let lines = new cv.Mat();
            cv.HoughLinesP(mask, lines, 1, Math.PI / 180, 30, 40, 50);

            // 4. トラッキング＆クラスタリング（軌跡ベースの1本化）
            let clusters = [];
            // 同じコードとみなす「横方向の最大のズレ」（ピクセル）※網のたるみ具合に応じて40〜60で調整
            const TRACK_DIST_THRESHOLD = 50; 

            for (let i = 0; i < lines.rows; ++i) {
                let x1 = lines.data32S[i * 4];
                let y1 = lines.data32S[i * 4 + 1];
                let x2 = lines.data32S[i * 4 + 2];
                let y2 = lines.data32S[i * 4 + 3];

                let angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
                if (angle > 90) angle -= 180;
                if (angle < -90) angle += 180;

                // 縦・横のノイズを完全にカット
                if (Math.abs(angle) < 50 || Math.abs(angle) > 85) continue;

                let a = (x2 - x1) !== 0 ? (y2 - y1) / (x2 - x1) : 9999;
                let b = y1 - a * x1;

                // 線上の3点（上部、中央、下部）のX座標の「軌跡」をシミュレーションする
                let y_top = Math.round(src.rows * 0.1);
                let y_mid = Math.round(src.rows * 0.5);
                let y_bot = Math.round(src.rows * 0.9);
                
                let x_top = (y_top - b) / a;
                let x_mid = (y_mid - b) / a;
                let x_bot = (y_bot - b) / a;

                // 既存のどのクラスター（コードの軌跡）に一番近いか探索
                let bestCluster = null;
                let minDelta = Infinity;

                for (let cluster of clusters) {
                    // 傾きの方向（青かオレンジか）が違うものは絶対混ぜない
                    let isSameDirection = (cluster.isPositive && a > 0) || (!cluster.isPositive && a < 0);
                    if (!isSameDirection) continue;

                    // 上・中・下の3点でのX座標のズレの平均を計算
                    let delta = (Math.abs(cluster.x_top - x_top) + Math.abs(cluster.x_mid - x_mid) + Math.abs(cluster.x_bot - x_bot)) / 3;
                    
                    if (delta < TRACK_DIST_THRESHOLD && delta < minDelta) {
                        minDelta = delta;
                        bestCluster = cluster;
                    }
                }

                if (bestCluster) {
                    // クラスターに点群を追加し、軌跡の基準値を更新
                    bestCluster.points.push({x: x1, y: y1}, {x: x2, y: y2});
                    bestCluster.x_top = (bestCluster.x_top + x_top) / 2;
                    bestCluster.x_mid = (bestCluster.x_mid + x_mid) / 2;
                    bestCluster.x_bot = (bestCluster.x_bot + x_bot) / 2;
                } else {
                    // 新規コードとしてクラスターを作成
                    clusters.push({
                        isPositive: a > 0,
                        x_top, x_mid, x_bot,
                        points: [{x: x1, y: y1}, {x: x2, y: y2}]
                    });
                }
            }

            // 5. 各クラスターの点群から最小二乗法で究極の1本線を割り出して描画
            clusters.forEach(cluster => {
                // 点の数が少なすぎるノイズは破棄
                if (cluster.points.length < 4) return;

                // 最小二乗法による直線フィッティング（y = ax + b の a と b を求める）
                let n = cluster.points.length;
                let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                
                cluster.points.forEach(p => {
                    sumX += p.x;
                    sumY += p.y;
                    sumXY += p.x * p.y;
                    sumXX += p.x * p.x;
                });

                // 傾き(fitA)と切片(fitB)の計算
                let fitA = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
                let fitB = (sumY - fitA * sumX) / n;

                // 画像の上端から下端までのX座標を計算
                let startY = 0;
                let startX = Math.round((startY - fitB) / fitA);
                let endY = dst.rows;
                let endX = Math.round((endY - fitB) / fitA);

                // 色分け判定（fitAの傾きベース）
                let color = (fitA > 0) ? new cv.Scalar(255, 165, 0, 255) : new cv.Scalar(0, 100, 255, 255);

                // 完全に1本化された直線を描画
                cv.line(dst, new cv.Point(startX, startY), new cv.Point(endX, endY), color, 3);
            });

            cv.imshow('canvasOutput', dst);

            // メモリ解放
            src.delete(); hsv.delete(); mask.delete(); dst.delete();
            lines.delete(); kernel.delete(); lowGreen.delete(); highGreen.delete();
        }
    </script>
</body>
</html>
